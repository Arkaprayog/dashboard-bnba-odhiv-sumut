plugins {
    id 'com.android.application'
}

android {
    namespace 'id.sahabatodhiv.sumut'
    compileSdk 35

    defaultConfig {
        applicationId 'id.sahabatodhiv.sumut'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.2.10'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
            def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')
            if (keystorePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation('androidx.biometric:biometric:1.1.0') {
        // Newer kotlin-stdlib already contains these classes; excluding legacy split
        // artifacts prevents duplicate-class failures during D8 packaging.
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
