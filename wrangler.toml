name = "dashboard-bnba-odhiv-sumut"
main = "src/index.ts"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "npm install && npm run build"
cwd = "./"

[env.production]
name = "dashboard-bnba-odhiv-sumut-prod"
workers_dev = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "ppks-odhiv-auth"
database_id = "c0b05571-c0ac-48a7-ac58-d600f7c7e5cb"

[env.production.vars]
APP_NAME = "Data Base PPKS ODHIV Sumut"
APP_ORIGIN = "https://dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev"
WEBAUTHN_RP_NAME = "Data Base PPKS ODHIV Sumut"
WEBAUTHN_RP_ID = "dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev"
SESSION_TTL_SECONDS = "28800"
LOG_LEVEL = "info"
VAPID_SUBJECT = "mailto:admin@sahabatodhiv-sumut.org"

[env.sahabatodhiv-sumut]
name = "sahabatodhiv-sumut"
workers_dev = true

[[env.sahabatodhiv-sumut.d1_databases]]
binding = "DB"
database_name = "ppks-odhiv-auth"
database_id = "c0b05571-c0ac-48a7-ac58-d600f7c7e5cb"

[env.sahabatodhiv-sumut.vars]
APP_NAME = "Data Base PPKS ODHIV Sumut"
APP_ORIGIN = "https://sahabatodhiv-sumut.aryprayoga139.workers.dev"
WEBAUTHN_RP_NAME = "Data Base PPKS ODHIV Sumut"
WEBAUTHN_RP_ID = "sahabatodhiv-sumut.aryprayoga139.workers.dev"
SESSION_TTL_SECONDS = "28800"
LOG_LEVEL = "info"
VAPID_SUBJECT = "mailto:admin@sahabatodhiv-sumut.org"

[env.sahabatodhiv-sumut.triggers]
crons = ["0 2 * * *"]

[env.staging]
name = "dashboard-bnba-odhiv-sumut-staging"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ppks-odhiv-auth"
database_id = "c0b05571-c0ac-48a7-ac58-d600f7c7e5cb"

[vars]
APP_NAME = "Data Base PPKS ODHIV Sumut"
APP_ORIGIN = "https://dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev"
WEBAUTHN_RP_NAME = "Data Base PPKS ODHIV Sumut"
WEBAUTHN_RP_ID = "dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev"
SESSION_TTL_SECONDS = "28800"
LOG_LEVEL = "info"

[env.staging.vars]
APP_NAME = "Data Base PPKS ODHIV Sumut"
APP_ORIGIN = "https://staging-dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev"
WEBAUTHN_RP_NAME = "Data Base PPKS ODHIV Sumut"
WEBAUTHN_RP_ID = "staging-dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev"
SESSION_TTL_SECONDS = "28800"
LOG_LEVEL = "debug"

[triggers]
crons = ["0 2 * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
