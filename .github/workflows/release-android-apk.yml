name: Build Sahabat ODHIV Sumut Release APK

on:
  workflow_dispatch:
  push:
    branches: [android-native-mvp]
    paths:
      - 'android-app/**'
      - '.github/workflows/release-android-apk.yml'

permissions:
  contents: read

jobs:
  release:
    name: Build and verify signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Require release signing secrets
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the four release-signing secrets in GitHub Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
      - name: Decode release keystore
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sahabat-odhiv-release.jks"
          test -s "$RUNNER_TEMP/sahabat-odhiv-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sahabat-odhiv-release.jks" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android XML resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in [
              Path('android-app/app/src/main/AndroidManifest.xml'),
              Path('android-app/app/src/main/res/xml/file_paths.xml'),
              Path('android-app/app/src/main/res/values/strings.xml'),
              Path('android-app/app/src/main/res/values/styles.xml'),
          ]:
              ET.parse(path)
              print(f'XML OK: {path}')
          PY
      - name: Run Android lint
        working-directory: android-app
        run: gradle --no-daemon lintRelease
      - name: Build signed release APK
        working-directory: android-app
        run: gradle --no-daemon assembleRelease
      - name: Verify APK and signature
        shell: bash
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          jarsigner -verify -verbose -certs "$APK"
          unzip -t "$APK"
          ls -lh "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahabat-ODHIV-Sumut-APK-release-v${{ github.run_number }}
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sahabat-odhiv-release.jks"
