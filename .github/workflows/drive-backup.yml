name: Weekly source backup to Cloudflare R2

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/drive-backup.yml"

permissions:
  contents: read

concurrency:
  group: sahabatodhiv-r2-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Archive source and upload privately to R2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="sahabatodhiv-sumut/" HEAD -- . \
            ':(exclude,glob).env*' \
            ':(exclude,glob)**/.env*' \
            ':(exclude,glob).dev.vars' \
            ':(exclude,glob)**/.dev.vars' \
            ':(exclude,glob)**/*.pem' \
            ':(exclude,glob)**/*.key' \
            ':(exclude,glob)**/*service-account*.json' \
            ':(exclude,glob)**/*credentials*.json' \
            ':(exclude,glob)**/*secret*.json' \
            ':(exclude,glob)**/*.sqlite' \
            ':(exclude,glob)**/*.sqlite3' \
            ':(exclude,glob)**/*.db' \
            ':(exclude,glob)**/respondent-data/**' \
            ':(exclude,glob)**/private-data/**' \
            ':(exclude,glob)**/uploads/**' \
            > "$RUNNER_TEMP/sahabatodhiv-sumut.tar.gz"
          size=$(wc -c < "$RUNNER_TEMP/sahabatodhiv-sumut.tar.gz")
          if [ "$size" -lt 1 ] || [ "$size" -gt 20971520 ]; then
            echo "::error::Archive size must be between 1 byte and 20 MiB."
            exit 1
          fi
          echo "Created source archive ($size bytes)."

      - name: Keep a recovery copy in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: sahabatodhiv-sumut-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sahabatodhiv-sumut.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Validate R2 secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${R2_ACCOUNT_ID:-}" ] || missing+=("R2_ACCOUNT_ID")
          [ -n "${R2_ACCESS_KEY_ID:-}" ] || missing+=("R2_ACCESS_KEY_ID")
          [ -n "${R2_SECRET_ACCESS_KEY:-}" ] || missing+=("R2_SECRET_ACCESS_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions repository secrets: ${missing[*]}"
            echo "Create an R2 API token with Object Read & Write permission scoped only to bucket sahabatodhiv-sumut-backups."
            exit 1
          fi
          if ! [[ "$R2_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::R2_ACCOUNT_ID must be the 32-character Cloudflare account ID."
            exit 1
          fi

      - name: Upload private archive to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet awscli
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          object_key="source/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/sahabatodhiv-sumut.tar.gz"
          aws --endpoint-url "$endpoint" s3 cp \
            "$RUNNER_TEMP/sahabatodhiv-sumut.tar.gz" \
            "s3://sahabatodhiv-sumut-backups/$object_key" \
            --content-type application/gzip \
            --only-show-errors
          echo "Backup uploaded to private R2 bucket: $object_key"
