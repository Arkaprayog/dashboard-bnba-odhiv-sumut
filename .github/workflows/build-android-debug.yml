name: Build Sahabat ODHIV Sumut Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-debug.yml'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build and verify installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android XML resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in [
              Path('android-app/app/src/main/AndroidManifest.xml'),
              Path('android-app/app/src/main/res/xml/file_paths.xml'),
              Path('android-app/app/src/main/res/values/strings.xml'),
              Path('android-app/app/src/main/res/values/styles.xml'),
          ]:
              ET.parse(path)
              print(f'XML OK: {path}')
          PY

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify APK package
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahabat-ODHIV-Sumut-APK-debug-v1.2.4
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
