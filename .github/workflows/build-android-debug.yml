name: Build Sahabat ODHIV Sumut Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-debug.yml'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build and verify installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services-secret.json"
            if python3 - "$RUNNER_TEMP/google-services-secret.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data.get('project_info', {}).get('project_id') == 'sahabatodhiv-sumut'
          clients = data.get('client', [])
          assert any(c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'id.sahabatodhiv.sumut' for c in clients)
          PY
            then
              cp "$RUNNER_TEMP/google-services-secret.json" android-app/app/google-services.json
              echo "Using validated Firebase config from Actions secret."
            else
              echo "::warning::GOOGLE_SERVICES_JSON is not valid for this Firebase app; falling back to the checked-in client configuration."
            fi
          else
            echo "::notice::GOOGLE_SERVICES_JSON secret is not available; using the checked-in Firebase client configuration."
          fi
          test -s android-app/app/google-services.json || (echo "::error::Firebase client config is missing." && exit 1)
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('android-app/app/google-services.json').read_text())
          assert data.get('project_info', {}).get('project_id') == 'sahabatodhiv-sumut', 'Firebase Project ID mismatch.'
          packages = [c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in data.get('client', [])]
          assert 'id.sahabatodhiv.sumut' in packages, 'The Firebase JSON does not include id.sahabatodhiv.sumut.'
          print('Firebase Android configuration validated without displaying its contents.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android XML resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in [
              Path('android-app/app/src/main/AndroidManifest.xml'),
              Path('android-app/app/src/main/res/xml/file_paths.xml'),
              Path('android-app/app/src/main/res/values/strings.xml'),
              Path('android-app/app/src/main/res/values/styles.xml'),
          ]:
              ET.parse(path)
              print(f'XML OK: {path}')
          PY

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon -PfcmDebugUseProductionPackage=true assembleDebug

      - name: Verify APK package
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='id.sahabatodhiv.sumut'"
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahabat-ODHIV-Sumut-APK-debug-v1.2.35
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
