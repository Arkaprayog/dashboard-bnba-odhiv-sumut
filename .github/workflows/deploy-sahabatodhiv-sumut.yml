name: Deploy Sahabat ODHIV Sumut Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sahabatodhiv-sumut-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy sahabatodhiv-sumut
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

      - name: Deploy the active Sahabat Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env sahabatodhiv-sumut
