name: Build Sahabat ODHIV Sumut Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-release:
    name: Build, lint, and verify signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services-secret.json"
            if python3 - "$RUNNER_TEMP/google-services-secret.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          assert data.get('project_info', {}).get('project_id') == 'sahabatodhiv-sumut'
          clients = data.get('client', [])
          assert any(c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'id.sahabatodhiv.sumut' for c in clients)
          PY
            then
              cp "$RUNNER_TEMP/google-services-secret.json" android-app/app/google-services.json
              echo "Using validated Firebase config from Actions secret."
            else
              echo "::warning::GOOGLE_SERVICES_JSON is not valid for this Firebase app; falling back to the checked-in client configuration."
            fi
          else
            echo "::notice::GOOGLE_SERVICES_JSON secret is not available; using the checked-in Firebase client configuration."
          fi
          test -s android-app/app/google-services.json || (echo "::error::Firebase client config is missing." && exit 1)
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('android-app/app/google-services.json').read_text())
          assert data.get('project_info', {}).get('project_id') == 'sahabatodhiv-sumut', 'Firebase Project ID mismatch.'
          packages = [c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in data.get('client', [])]
          assert 'id.sahabatodhiv.sumut' in packages, 'The Firebase JSON does not include id.sahabatodhiv.sumut.'
          print('Firebase Android configuration validated without displaying its contents.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android XML resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          paths = [
              Path('android-app/app/src/main/AndroidManifest.xml'),
              Path('android-app/app/src/main/res/xml/file_paths.xml'),
              Path('android-app/app/src/main/res/values/strings.xml'),
              Path('android-app/app/src/main/res/values/styles.xml'),
          ]
          for path in paths:
              ET.parse(path)
              print(f'XML OK: {path}')
          manifest = ET.parse(paths[0]).getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          permissions = {node.attrib.get(android + 'name') for node in manifest.findall('uses-permission')}
          assert 'android.permission.CAMERA' not in permissions, 'External camera intent should not request direct CAMERA permission.'
          queries = manifest.find('queries')
          assert queries is not None and any(node.attrib.get(android + 'name') == 'android.media.action.IMAGE_CAPTURE' for node in queries.findall('./intent/action')), 'Camera intent visibility query is missing.'
          app = manifest.find('application')
          assert app is not None and app.attrib.get(android + 'resizeableActivity') == 'true', 'Application must support resizing on tablets.'
          print('Android manifest behavior checks passed.')
          PY

      - name: Run Android lint
        working-directory: android-app
        run: gradle --no-daemon lintRelease

      - name: Require release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Set ANDROID_KEYSTORE_BASE64 in repository Actions secrets." && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Set ANDROID_KEYSTORE_PASSWORD in repository Actions secrets." && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Set ANDROID_KEY_ALIAS in repository Actions secrets." && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Set ANDROID_KEY_PASSWORD in repository Actions secrets." && exit 1)
          mkdir -p "$RUNNER_TEMP/android-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.jks"
          test -s "$RUNNER_TEMP/android-signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signed release APK
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$APK"
          ls -lh "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahabat-ODHIV-Sumut-APK-release-v1.2.34
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
