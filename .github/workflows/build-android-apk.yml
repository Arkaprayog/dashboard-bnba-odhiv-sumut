name: Build Sahabat ODHIV Sumut Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-native-mvp]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android XML resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          paths = [
              Path('android-app/app/src/main/AndroidManifest.xml'),
              Path('android-app/app/src/main/res/xml/file_paths.xml'),
              Path('android-app/app/src/main/res/values/strings.xml'),
              Path('android-app/app/src/main/res/values/styles.xml'),
          ]
          for path in paths:
              ET.parse(path)
              print(f'XML OK: {path}')
          manifest = ET.parse(paths[0]).getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          permissions = {node.attrib.get(android + 'name') for node in manifest.findall('uses-permission')}
          assert 'android.permission.CAMERA' not in permissions, 'External camera intent should not request direct CAMERA permission.'
          queries = manifest.find('queries')
          assert queries is not None and any(node.attrib.get(android + 'name') == 'android.media.action.IMAGE_CAPTURE' for node in queries.findall('./intent/action')), 'Camera intent visibility query is missing.'
          app = manifest.find('application')
          assert app is not None and app.attrib.get(android + 'resizeableActivity') == 'true', 'Application must support resizing on tablets.'
          print('Android manifest behavior checks passed.')
          PY
      - name: Run Android lint
        working-directory: android-app
        run: gradle --no-daemon lintDebug
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists and inspect package
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          file android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahabat-ODHIV-Sumut-APK-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
