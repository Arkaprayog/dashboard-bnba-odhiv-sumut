          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/sahabat-respondents.json","utf8"));if(!d.error)process.exit(1);'
          stage1_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-stage1.json --write-out '%{http_code}' "$APP_URL/api/questionnaires/stage1")"
          test "$stage1_status" = "401" || (echo "::error::Combined questionnaire data API must require owner/admin authentication (HTTP 401), got $stage1_status." && exit 1)
          team_profile_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-team-profile.json --write-out '%{http_code}' "$APP_URL/api/team-me")"
          test "$team_profile_status" = "401" || (echo "::error::Team profile API must require a team session (HTTP 401), got $team_profile_status." && exit 1)
          team_password_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-team-password.json --write-out '%{http_code}' -X POST -H "Origin: $APP_URL" -H 'Content-Type: application/json' -H 'X-CSRF-Token: unauthenticated-test' --data '{}' "$APP_URL/api/team-petugas/password")"
          test "$team_password_status" = "401" || (echo "::error::Team password reset API must require an authenticated owner/admin session (HTTP 401), got $team_password_status." && exit 1)

          delete_assessment_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-assessment-delete.json --write-out '%{http_code}' -X DELETE -H "Origin: $APP_URL" -H 'X-CSRF-Token: unauthenticated-test' "$APP_URL/api/assessments/item?id=00000000-0000-4000-8000-000000000000")"
          test "$delete_assessment_status" = "401" || (echo "::error::Assessment deletion API must require an authenticated session (HTTP 401), got $delete_assessment_status." && exit 1)
          bootstrap_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-bootstrap.json --write-out '%{http_code}' -X POST -H "Origin: $APP_URL" -H "Content-Type: application/json" --data '{}' "$APP_URL/api/setup-owner")"
          test "$bootstrap_status" = "403" || (echo "::error::Sahabat bootstrap endpoint must reject requests without a token (HTTP 403), got $bootstrap_status." && cat /tmp/sahabat-bootstrap.json && exit 1)
          surat_response="$(curl --connect-timeout 5 --max-time 20 --location --max-redirs 5 --silent --show-error --output /tmp/sahabat-surat-lainnya.html --write-out '%{http_code}|%{url_effective}' "$APP_URL/surat-lainnya.html")"
          surat_status="${surat_response%%|*}"
          echo "Surat Lainnya final response URL: ${surat_response#*|} (HTTP $surat_status)"
          test "$surat_status" = "200" || (echo "::error::Surat Lainnya page returned HTTP $surat_status." && exit 1)
          grep -q 'api.qrserver.com/v1/create-qr-code' /tmp/sahabat-surat-lainnya.html || (echo "::error::Deployed Surat Lainnya QR image is missing." && exit 1)
          grep -q 'data=https%3A%2F%2Fdocs.google.com%2Fdocument%2Fd%2F1RuoyRlTIEy24zhewd126KYq53olKuHRv-4BUiIoo82U%2Fedit%3Fusp%3Ddrivesdk' /tmp/sahabat-surat-lainnya.html || (echo "::error::Deployed Surat Lainnya QR points to an unexpected document." && exit 1)
          grep -q 'ecc=H' /tmp/sahabat-surat-lainnya.html && grep -q 'qzone=4' /tmp/sahabat-surat-lainnya.html || (echo "::error::Deployed Surat Lainnya QR needs high error correction and quiet zone." && exit 1)
          grep -q 'src="/logos/kemensos.png" alt="Logo Kemensos"' /tmp/sahabat-surat-lainnya.html || (echo "::error::Deployed Surat Lainnya is missing the centered local Kemensos logo." && exit 1)
          surat_css_response="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-surat-lainnya.css --write-out '%{http_code}|%{content_type}' "$APP_URL/surat-lainnya-layout.css?v=2.0.0&verify=$GITHUB_SHA")"
          surat_css_status="${surat_css_response%%|*}"
          surat_css_type="${surat_css_response#*|}"
          test "$surat_css_status" = "200" || (echo "::error::Surat Lainnya layout CSS returned HTTP $surat_css_status." && exit 1)
          case "$surat_css_type" in text/css*) ;; *) echo "::error::Surat Lainnya layout CSS has unexpected content type: $surat_css_type." && exit 1 ;; esac
          grep -Fq '@page{size:A4;margin:17mm 17mm 16mm}' /tmp/sahabat-surat-lainnya.css && grep -q 'signature-title' /tmp/sahabat-surat-lainnya.css && grep -q 'signature-name' /tmp/sahabat-surat-lainnya.css || (echo "::error::Deployed Surat Lainnya layout CSS is missing its A4 signature rules." && exit 1)
          grep -q 'signature-title' /tmp/sahabat-surat-lainnya.html && grep -q 'signature-name' /tmp/sahabat-surat-lainnya.html || (echo "::error::Deployed Surat Lainnya signature markup is missing." && exit 1)
          echo "Verified deployed Surat Lainnya page, A4 signature block, Kemensos logo and Google Docs QR."
          echo "Sahabat ODHIV smoke checks passed: public page available, respondent API protected, bootstrap rejects missing token."
