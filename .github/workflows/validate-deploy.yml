name: Validate and deploy Cloudflare Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Check all inline JavaScript syntax in dashboard HTML
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          // Protect escaped closing tags embedded in JavaScript template literals.
          const sentinel = '__ESCAPED_SCRIPT_CLOSE__';
          const protectedHtml = html.replace(/<\\\/script>/gi, sentinel);
          const scripts = [...protectedHtml.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]));
          if (!scripts.length) throw new Error('No inline dashboard scripts found.');
          scripts.forEach((match, index) => {
            const path = `/tmp/dashboard-inline-${index + 1}.js`;
            fs.writeFileSync(path, match[2].replaceAll(sentinel, '<\\/script>'));
            console.log(`Checking inline script ${index + 1}/${scripts.length}: ${path}`);
            require('child_process').execFileSync(process.execPath, ['--check', path], { stdio: 'inherit' });
          });
          const opens = [...html.matchAll(/<script\b/gi)].length;
          const closes = [...html.matchAll(/(?<!\\)<\/script>/gi)].length;
          if (opens !== closes) throw new Error(`Mismatched script tags: ${opens} opening vs ${closes} closing.`);
          NODE
          test -s public/sw.js
      - name: Validate dashboard Wrangler configuration (dry run)
        # Deployment targets the default Worker name used by the public dashboard URL.
        run: npx wrangler deploy --dry-run
      - name: Validate Sahabat ODHIV Wrangler configuration (dry run)
        run: npx wrangler deploy --dry-run --env sahabatodhiv-sumut

  deploy:
    name: Deploy and health-check production Worker
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Cloudflare secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN in GitHub Actions secrets/environment." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets/environment." && exit 1)
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Deploy Sahabat ODHIV Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env sahabatodhiv-sumut
      - name: Verify Sahabat ODHIV backend health
        env:
          HEALTH_URL: https://sahabatodhiv-sumut.aryprayoga139.workers.dev/api/health
        run: |
          for attempt in $(seq 1 10); do
            response="$(curl --fail --silent --show-error "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$response" | node -e '
              let data = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                try {
                  const result = JSON.parse(data);
                  if (result.ok === true && result.database === "connected" && result.mode === "ready") process.exit(0);
                } catch {}
                process.exit(1);
              });
            '; then
              echo "Sahabat ODHIV backend health check passed: $response"
              exit 0
            fi
            echo "Sahabat health check attempt $attempt/10 failed; retrying in 6 seconds."
            sleep 6
          done
          echo "::error::Sahabat ODHIV backend health check did not confirm ok=true, database=connected, mode=ready."
          exit 1
      - name: Verify Sahabat ODHIV public page and protected respondent endpoint
        env:
          APP_URL: https://sahabatodhiv-sumut.aryprayoga139.workers.dev
        run: |
          page_status="$(curl --silent --show-error --output /tmp/sahabat-dashboard.html --write-out '%{http_code}' "$APP_URL/")"
          test "$page_status" = "200" || (echo "::error::Sahabat dashboard page returned HTTP $page_status." && exit 1)
          grep -qi '<html' /tmp/sahabat-dashboard.html || (echo "::error::Sahabat dashboard response is not HTML." && exit 1)
          grep -q 'ownerProfileForm' /tmp/sahabat-dashboard.html || (echo "::error::Owner profile UI is missing." && exit 1)
          sw_status="$(curl --silent --show-error --output /tmp/sahabat-sw.js --write-out '%{http_code}' "$APP_URL/sw.js")"
          test "$sw_status" = "200" || (echo "::error::Service worker returned HTTP $sw_status." && exit 1)
          grep -q "addEventListener('push'" /tmp/sahabat-sw.js || (echo "::error::Push event handler missing." && exit 1)
          profile_status="$(curl --silent --show-error --output /tmp/sahabat-profile.json --write-out '%{http_code}' "$APP_URL/api/owner-profile")"
          test "$profile_status" = "401" || (echo "::error::Owner profile API must be protected (HTTP 401), got $profile_status." && exit 1)
          notifications_status="$(curl --silent --show-error --output /tmp/sahabat-notifications.json --write-out '%{http_code}' "$APP_URL/api/notifications")"
          test "$notifications_status" = "401" || (echo "::error::Notifications API must be protected (HTTP 401), got $notifications_status." && exit 1)
          api_status="$(curl --silent --show-error --output /tmp/sahabat-respondents.json --write-out '%{http_code}' "$APP_URL/api/respondents")"
          test "$api_status" = "401" || (echo "::error::Sahabat respondent API should require authentication (HTTP 401), got $api_status." && cat /tmp/sahabat-respondents.json && exit 1)
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/sahabat-respondents.json","utf8"));if(!d.error)process.exit(1);'
          bootstrap_status="$(curl --silent --show-error --output /tmp/sahabat-bootstrap.json --write-out '%{http_code}' -X POST -H "Origin: $APP_URL" -H "Content-Type: application/json" --data '{}' "$APP_URL/api/setup-owner")"
          test "$bootstrap_status" = "403" || (echo "::error::Sahabat bootstrap endpoint must reject requests without a token (HTTP 403), got $bootstrap_status." && cat /tmp/sahabat-bootstrap.json && exit 1)
          echo "Sahabat ODHIV smoke checks passed: public page available, respondent API protected, bootstrap rejects missing token."
      - name: Verify production backend health
        env:
          HEALTH_URL: https://dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev/api/health
        run: |
          for attempt in $(seq 1 10); do
            response="$(curl --fail --silent --show-error "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$response" | node -e '
              let data = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                try {
                  const result = JSON.parse(data);
                  if (result.ok === true && result.database === "connected" && result.mode === "ready") process.exit(0);
                } catch {}
                process.exit(1);
              });
            '; then
              echo "Backend health check passed: $response"
              exit 0
            fi
            echo "Health check attempt $attempt/10 failed; retrying in 6 seconds."
            sleep 6
          done
          echo "::error::Backend health check did not confirm ok=true, database=connected, mode=ready."
          exit 1
      - name: Verify public page and protected respondent endpoint
        env:
          APP_URL: https://dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev
        run: |
          page_status="$(curl --silent --show-error --output /tmp/dashboard.html --write-out '%{http_code}' "$APP_URL/")"
          test "$page_status" = "200" || (echo "::error::Dashboard page returned HTTP $page_status." && exit 1)
          grep -qi '<html' /tmp/dashboard.html || (echo "::error::Dashboard response is not HTML." && exit 1)
          grep -q 'ownerProfileForm' /tmp/dashboard.html || (echo "::error::Owner profile UI is missing." && exit 1)
          sw_status="$(curl --silent --show-error --output /tmp/dashboard-sw.js --write-out '%{http_code}' "$APP_URL/sw.js")"
          test "$sw_status" = "200" || (echo "::error::Service worker returned HTTP $sw_status." && exit 1)
          grep -q "addEventListener('push'" /tmp/dashboard-sw.js || (echo "::error::Push event handler missing." && exit 1)
          profile_status="$(curl --silent --show-error --output /tmp/dashboard-profile.json --write-out '%{http_code}' "$APP_URL/api/owner-profile")"
          test "$profile_status" = "401" || (echo "::error::Owner profile API must be protected (HTTP 401), got $profile_status." && exit 1)
          notifications_status="$(curl --silent --show-error --output /tmp/dashboard-notifications.json --write-out '%{http_code}' "$APP_URL/api/notifications")"
          test "$notifications_status" = "401" || (echo "::error::Notifications API must be protected (HTTP 401), got $notifications_status." && exit 1)
          api_status="$(curl --silent --show-error --output /tmp/respondents.json --write-out '%{http_code}' "$APP_URL/api/respondents")"
          test "$api_status" = "401" || (echo "::error::Unauthenticated respondent endpoint should return HTTP 401, got $api_status." && cat /tmp/respondents.json && exit 1)
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/respondents.json","utf8"));if(!d.error)process.exit(1);'
          bootstrap_status="$(curl --silent --show-error --output /tmp/production-bootstrap.json --write-out '%{http_code}' -X POST -H "Origin: $APP_URL" -H "Content-Type: application/json" --data '{}' "$APP_URL/api/setup-owner")"
          test "$bootstrap_status" = "403" || (echo "::error::Production bootstrap endpoint must reject requests without a token (HTTP 403), got $bootstrap_status." && cat /tmp/production-bootstrap.json && exit 1)
          echo "Production smoke checks passed: dashboard HTML available, respondent API protected, bootstrap rejects missing token."
