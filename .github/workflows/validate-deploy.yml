name: Validate and deploy Cloudflare Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck

  deploy:
    name: Deploy and health-check production Worker
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Cloudflare secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN in GitHub Actions secrets/environment." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets/environment." && exit 1)
      - name: Apply idempotent D1 schema
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute ppks-odhiv-auth --remote --file=./schema.sql
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify production backend health
        env:
          HEALTH_URL: https://dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev/api/health
        run: |
          for attempt in $(seq 1 10); do
            response="$(curl --fail --silent --show-error "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$response" | node -e '
              let data = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                try {
                  const result = JSON.parse(data);
                  if (result.ok === true && result.database === "connected" && result.mode === "ready") process.exit(0);
                } catch {}
                process.exit(1);
              });
            '; then
              echo "Backend health check passed: $response"
              exit 0
            fi
            echo "Health check attempt $attempt/10 failed; retrying in 6 seconds."
            sleep 6
          done
          echo "::error::Backend health check did not confirm ok=true, database=connected, mode=ready."
          exit 1
      - name: Verify public page and protected respondent endpoint
        env:
          APP_URL: https://dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev
        run: |
          page_status="$(curl --silent --show-error --output /tmp/dashboard.html --write-out '%{http_code}' "$APP_URL/")"
          test "$page_status" = "200" || (echo "::error::Dashboard page returned HTTP $page_status." && exit 1)
          grep -qi '<html' /tmp/dashboard.html || (echo "::error::Dashboard response is not HTML." && exit 1)
          api_status="$(curl --silent --show-error --output /tmp/respondents.json --write-out '%{http_code}' "$APP_URL/api/respondents")"
          test "$api_status" = "401" || (echo "::error::Unauthenticated respondent endpoint should return HTTP 401, got $api_status." && cat /tmp/respondents.json && exit 1)
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/respondents.json","utf8"));if(!d.error)process.exit(1);'
          echo "Production smoke checks passed: dashboard HTML is available and respondent API requires authentication."
