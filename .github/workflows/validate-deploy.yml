name: Validate and deploy Cloudflare Worker

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'schema.sql'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/validate-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'schema.sql'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/validate-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sahabatodhiv-sumut-production
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Check all inline JavaScript syntax in dashboard HTML
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          // Protect escaped closing tags embedded in JavaScript template literals.
          const sentinel = '__ESCAPED_SCRIPT_CLOSE__';
          const protectedHtml = html.replace(/<\\\/script>/gi, sentinel);
          const scripts = [...protectedHtml.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]));
          if (!scripts.length) throw new Error('No inline dashboard scripts found.');
          scripts.forEach((match, index) => {
            const path = `/tmp/dashboard-inline-${index + 1}.js`;
            fs.writeFileSync(path, match[2].replaceAll(sentinel, '<\\/script>'));
            console.log(`Checking inline script ${index + 1}/${scripts.length}: ${path}`);
            require('child_process').execFileSync(process.execPath, ['--check', path], { stdio: 'inherit' });
          });
          // Count parsed HTML script blocks, not tag-like strings embedded inside JavaScript templates.
          console.log(`Validated ${scripts.length} inline JavaScript blocks; escaped HTML snippets are intentionally ignored.`);
          NODE
          test -s public/sw.js
      - name: Validate respondent questionnaire intro and QR destinations
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const intro = fs.readFileSync('public/kuisioner-responden.html', 'utf8');
          const dashboard = fs.readFileSync('public/index.html', 'utf8');
          const activity = fs.readFileSync('android-app/app/src/main/java/id/sahabatodhiv/sumut/MainActivity.java', 'utf8');
          const checks = [
            ['questionnaire has no animated illustration or timer', !intro.includes('animation:') && !intro.includes('@keyframes') && !intro.includes('setTimeout') && !intro.includes('sceneOut') && !intro.includes('kiteFloat')],
            ['questionnaire redirects directly to canonical Google Form', intro.includes('window.location.replace("https://docs.google.com/forms/d/e/1FAIpQLSfugEp7XQ_YmR9PQNEqLjtm-wilOqlUvF7hW_ewSOt_2Y_guw/viewform")')],
            ['questionnaire keeps a usable fallback link', intro.includes('id="formLink"') && intro.includes('Buka Google Forms')],
            ['dashboard login opens without animated intro', !dashboard.includes('startCollaborationIntro') && !dashboard.includes('collab-intro')],
            ['native app has no animated splash or artificial delay', !activity.includes('AnimatedSplashView') && !activity.includes('3000L') && activity.includes('setContentView(webView);')],
            ['dashboard link and QR target questionnaire page', dashboard.includes('kuisioner-responden.html')],
            ['old short form link removed', !dashboard.includes('9YuWSVtgpcSed5St5')],
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (!ok) process.exitCode = 1;
          }
          NODE
      - name: Validate final polish, upload allowlist, and security headers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const worker = fs.readFileSync('src/index.ts', 'utf8');
          const checks = [
            ['final centered login size 2 and version', html.includes('id="final-login-size-2-v1-1-5"') && html.includes('body:not(.authenticated) main{width:min(100%,360px)!important') && html.includes('v1.1.5 — dashboard notification and settings: compact, centered, readable')],
            ['Kemensos logo centered over QR', html.includes('respondent-quiz-qr-logo') && html.includes('class="respondent-quiz-qr-frame"')],
            ['camera and document upload choices', html.includes('application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document') && html.includes('capture="environment"')],
            ['server validates PDF/DOC/DOCX upload MIME', worker.includes('application/pdf", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document')],
            ['private file route requires an admin session', worker.includes('url.pathname === "/api/respondent-file"') && worker.includes('Peran tidak diizinkan mengakses berkas responden.')],
            ['WhatsApp template has respondent name and time greeting', html.includes('const respondentName=') && html.includes("const greeting=hour>=4&&hour<11?'pagi'") && html.includes('Deny Arifin Martyon')],
            ['Content-Security-Policy configured', worker.includes('content-security-policy') && worker.includes("frame-ancestors 'none'")],
            ['notification logging redacts raw exception messages', worker.includes(`notification_record_failed", { action, stage: "record" }`) && !worker.includes(`notification_record_failed", { action, message:`)],
            ['copyright notice visible', html.includes('© 2026 Data Base ODHIV Sumatera Utara')],
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (!ok) process.exitCode = 1;
          }
          NODE
      - name: Validate push notification enrollment and delivery handlers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const sw = fs.readFileSync('public/sw.js', 'utf8');
          const worker = fs.readFileSync('src/index.ts', 'utf8');
          const checks = [
            ['owner notification panel exists', html.includes('id="pushNotificationPanel"') && html.includes('id="enablePushNotifications"')],
            ['browser permission and PushManager subscription', html.includes('Notification.requestPermission()') && html.includes('registration.pushManager.subscribe')],
            ['subscription uses CSRF protection', html.includes("fetch('/api/push-subscriptions',{method:'POST'") && html.includes("'X-CSRF-Token':csrfToken")],
            ['test button targets actual Worker endpoint', html.includes("fetch('/api/push-test',{method:'POST'") && worker.includes('url.pathname === "/api/push-test"')],
            ['service worker receives and displays push', sw.includes("addEventListener('push'") && sw.includes('showNotification')],
            ['push notifications request vibration', sw.includes('vibrate:[250,120,250,120,350]')],
            ['dashboard has no animated intro', !html.includes('startCollaborationIntro') && !html.includes('collab-intro') && !html.includes('await startCollaborationIntro')],
            ['push test remains queued unless delivery is confirmed', worker.includes('push_test_pending') && worker.includes('delivery.configured && delivery.subscriptions > 0 && delivery.failed === 0') && worker.includes('Promise<{ configured: boolean; subscriptions: number; failed: number }>')],
            ['push delivery logs avoid exposing provider exception details', worker.includes('Do not log provider exception text') && worker.includes('console.warn("push_delivery_failed", { stage: "request" })')],
            ['Worker stores subscriptions and polls form response rows', worker.includes('INSERT INTO push_subscriptions') && worker.includes("state_key='response_row_count'")],
            ['push enrollment does not require private signing key on receiver', worker.includes('enabled: !!(env.VAPID_PUBLIC_KEY && env.VAPID_SUBJECT)')],
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (!ok) process.exitCode = 1;
          }
          NODE
      - name: Validate single scheduled poller and push-key alignment
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('wrangler.toml', 'utf8');
          const blocks = [
            ['root dashboard legacy', '[triggers]\ncrons = []'],
            ['Sahabat primary', '[env.sahabatodhiv-sumut.triggers]\ncrons = ["* * * * *"]'],
            ['production alias', '[env.production.triggers]\ncrons = []'],
            ['staging', '[env.staging.triggers]\ncrons = []'],
          ];
          for (const [name, text] of blocks) {
            if (!config.includes(text)) throw new Error(name + ' cron configuration is incorrect.');
          }
          if (config.split('crons = ["* * * * *"]').length - 1 !== 1) throw new Error('Exactly one Worker must own the one-minute poller.');
          if (!fs.readFileSync('.github/workflows/validate-deploy.yml', 'utf8').includes('Clear legacy dashboard cron trigger')) throw new Error('Production workflow must explicitly clear legacy dashboard cron triggers through the Cloudflare API.');
          console.log('PASS one poller runs on Sahabat; deployment clears stale Sahabat schedule');
          NODE
      - name: Validate Sahabat ODHIV Wrangler configuration (dry run)
        run: npx wrangler deploy --dry-run --env sahabatodhiv-sumut

  deploy:
    name: Deploy and health-check production Worker
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Cloudflare secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN in GitHub Actions secrets/environment." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets/environment." && exit 1)
      - name: Deploy Sahabat ODHIV Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env sahabatodhiv-sumut
      - name: Clear stale Sahabat cron trigger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response="$(curl --fail --silent --show-error -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/dashboard-bnba-odhiv-sumut/schedules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '[]')"
          printf '%s' "$response" | node -e '
            let data = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              try {
                const result = JSON.parse(data);
                if (result.success === true && Array.isArray(result.result?.schedules) && result.result.schedules.length === 0) process.exit(0);
              } catch {}
              process.stderr.write("Cloudflare did not confirm that legacy dashboard cron schedules are empty.\\n");
              process.exit(1);
            });
          '
      - name: Verify Sahabat ODHIV backend health
        env:
          HEALTH_URL: https://sahabatodhiv-sumut.aryprayoga139.workers.dev/api/health
        run: |
          for attempt in $(seq 1 10); do
            response="$(curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$response" | node -e '
              let data = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                try {
                  const result = JSON.parse(data);
                  if (result.ok === true && result.database === "connected" && result.mode === "ready") process.exit(0);
                } catch {}
                process.exit(1);
              });
            '; then
              echo "Sahabat ODHIV backend health check passed: $response"
              exit 0
            fi
            echo "Sahabat health check attempt $attempt/10 failed; retrying in 6 seconds."
            sleep 6
          done
          echo "::error::Sahabat ODHIV backend health check did not confirm ok=true, database=connected, mode=ready."
          exit 1
      - name: Verify Sahabat ODHIV public page and protected respondent endpoint
        env:
          APP_URL: https://sahabatodhiv-sumut.aryprayoga139.workers.dev
        run: |
          page_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-dashboard.html --write-out '%{http_code}' "$APP_URL/")"
          test "$page_status" = "200" || (echo "::error::Sahabat dashboard page returned HTTP $page_status." && exit 1)
          grep -qi '<html' /tmp/sahabat-dashboard.html || (echo "::error::Sahabat dashboard response is not HTML." && exit 1)
          grep -q 'ownerProfileForm' /tmp/sahabat-dashboard.html || (echo "::error::Owner profile UI is missing." && exit 1)
          quiz_status="$(curl --connect-timeout 5 --max-time 20 --location --max-redirs 5 --silent --show-error --output /tmp/sahabat-questionnaire.html --write-out '%{http_code}' "$APP_URL/kuisioner-responden.html")"
          test "$quiz_status" = "200" || (echo "::error::Questionnaire intro page returned HTTP $quiz_status." && exit 1)
          grep -q '1FAIpQLSfugEp7XQ_YmR9PQNEqLjtm-wilOqlUvF7hW_ewSOt_2Y_guw' /tmp/sahabat-questionnaire.html || (echo "::error::Questionnaire intro is missing the canonical Google Form URL." && exit 1)
          grep -q 'window.location.replace("https://docs.google.com/forms/d/e/1FAIpQLSfugEp7XQ_YmR9PQNEqLjtm-wilOqlUvF7hW_ewSOt_2Y_guw/viewform")' /tmp/sahabat-questionnaire.html || (echo "::error::Questionnaire must redirect directly to the canonical Google Form." && exit 1)
          ! grep -q 'window.setTimeout\|animation:\|@keyframes' /tmp/sahabat-questionnaire.html || (echo "::error::Questionnaire must not contain an animation or artificial redirect delay." && exit 1)
          sw_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-sw.js --write-out '%{http_code}' "$APP_URL/sw.js")"
          test "$sw_status" = "200" || (echo "::error::Service worker returned HTTP $sw_status." && exit 1)
          grep -q "addEventListener('push'" /tmp/sahabat-sw.js || (echo "::error::Push event handler missing." && exit 1)
          profile_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-profile.json --write-out '%{http_code}' "$APP_URL/api/owner-profile")"
          test "$profile_status" = "401" || (echo "::error::Owner profile API must be protected (HTTP 401), got $profile_status." && exit 1)
          notifications_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-notifications.json --write-out '%{http_code}' "$APP_URL/api/notifications")"
          test "$notifications_status" = "401" || (echo "::error::Notifications API must be protected (HTTP 401), got $notifications_status." && exit 1)
          api_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-respondents.json --write-out '%{http_code}' "$APP_URL/api/respondents")"
          test "$api_status" = "401" || (echo "::error::Sahabat respondent API should require authentication (HTTP 401), got $api_status." && cat /tmp/sahabat-respondents.json && exit 1)
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/sahabat-respondents.json","utf8"));if(!d.error)process.exit(1);'
          bootstrap_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-bootstrap.json --write-out '%{http_code}' -X POST -H "Origin: $APP_URL" -H "Content-Type: application/json" --data '{}' "$APP_URL/api/setup-owner")"
          test "$bootstrap_status" = "403" || (echo "::error::Sahabat bootstrap endpoint must reject requests without a token (HTTP 403), got $bootstrap_status." && cat /tmp/sahabat-bootstrap.json && exit 1)
          echo "Sahabat ODHIV smoke checks passed: public page available, respondent API protected, bootstrap rejects missing token."
