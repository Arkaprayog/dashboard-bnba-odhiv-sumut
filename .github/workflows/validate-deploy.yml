          case "$assessment_css_type" in text/css*) ;; *) echo "::error::Assessment glass CSS has unexpected content type: $assessment_css_type." && exit 1 ;; esac
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr))' /tmp/sahabat-assessment-glass.css || (echo "::error::Assessment photo card two-column layout is missing." && exit 1)
          grep -Fq 'backdrop-filter:blur(18px)' /tmp/sahabat-assessment-glass.css || (echo "::error::Assessment glass blur treatment is missing." && exit 1)
          grep -Fq 'aspect-ratio:1/1!important' /tmp/sahabat-assessment-glass.css || (echo "::error::Assessment photo cards are not square." && exit 1)
          grep -Fq 'width:min(100%,190px)!important' /tmp/sahabat-assessment-glass.css || (echo "::error::Assessment photo cards are not size bounded." && exit 1)
          grep -Fq 'grid-auto-rows:max-content!important' /tmp/sahabat-assessment-glass.css || (echo "::error::Assessment photo card grid can still stretch rows." && exit 1)
          ! grep -Eiq '<input[[:space:]]+type="file"[^>]*id="assessmentPhoto(Self|Ktp|Kk|Home)"' /tmp/sahabat-dashboard.html || (echo "::error::Manual upload controls remain in the assessment form." && exit 1)
          echo "Verified live dashboard version 1.1.59 with automatic PPKS photo cards, full-width clear-sheet action, clean card CSS, security headers and glass layout."
          for photo in 1 2 3; do
            photo_response="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output "/tmp/sahabat-toba-photo-$photo.jpg" --write-out '%{http_code}|%{content_type}' "$APP_URL/danau-toba/photo-$photo.jpg?v=1.2.9")"
