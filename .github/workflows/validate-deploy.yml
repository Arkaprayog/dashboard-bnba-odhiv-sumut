name: Validate and deploy Cloudflare Worker

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'schema.sql'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'android-app/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'DEPLOYMENT*.md'
      - 'CLOUDFLARE_DEPLOYMENT.md'
      - 'scripts/**'
      - 'docs/**'
      - 'SECURITY.md'
      - '.github/workflows/validate-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'schema.sql'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'android-app/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'DEPLOYMENT*.md'
      - 'CLOUDFLARE_DEPLOYMENT.md'
      - 'scripts/**'
      - 'docs/**'
      - 'SECURITY.md'
      - '.github/workflows/validate-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sahabatodhiv-sumut-production
  cancel-in-progress: false

jobs:
  validate:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract Danau Toba slideshow photos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          archive = Path('public/danau-toba-landingpage.zip')
          target = Path('public/danau-toba')
          if not archive.is_file():
              raise SystemExit('Missing public/danau-toba-landingpage.zip')
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              photos = [item for item in z.infolist() if not item.is_dir() and item.filename.lower().endswith(('.jpg', '.jpeg'))]
              if len(photos) != 7:
                  raise SystemExit(f'Expected exactly 7 JPG photos, found {len(photos)}')
              for index, item in enumerate(photos, 1):
                  with z.open(item) as src, (target / f'photo-{index}.jpg').open('wb') as dst:
                      shutil.copyfileobj(src, dst)
          print('Extracted 7 Danau Toba slideshow photos.')
          PY
      - name: Assemble owner dashboard background image
        run: |
          set -euo pipefail
          test -d .build-assets/owner-background
          cat .build-assets/owner-background/part-*.b64 | tr -d '\r\n' | base64 --decode > public/owner-background.webp
          python3 - <<'PY'
          from pathlib import Path
          asset = Path("public/owner-background.webp")
          data = asset.read_bytes()
          if len(data) < 10000 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
              raise SystemExit("Owner background asset is not a valid WebP image.")
          print(f"Owner background asset verified: {len(data)} bytes.")
          PY
      - name: Install dependencies
        run: npm install
      - name: Bundle PDF generator within the same-origin assets
        run: |
          set -euo pipefail
          mkdir -p public/vendor
          test -s node_modules/pdf-lib/dist/pdf-lib.min.js
          cp node_modules/pdf-lib/dist/pdf-lib.min.js public/vendor/pdf-lib.min.js
          test -s public/vendor/pdf-lib.min.js
          echo "Bundled self-hosted pdf-lib browser runtime."


      - name: Validate safe owner bootstrap helper
        run: bash -n scripts/setup-admin.sh
      - name: Test trusted news URL policy
        run: node scripts/test-news-url-policy.mjs
      - name: Validate Google Drive backup safety contract
        run: node scripts/test-drive-backup-contract.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test dashboard profile sync and release version alignment
        run: node scripts/test-dashboard-profile-sync.mjs
      - name: Check all inline JavaScript syntax in dashboard HTML
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          // Protect escaped closing tags embedded in JavaScript template literals.
          const sentinel = '__ESCAPED_SCRIPT_CLOSE__';
          const protectedHtml = html.replace(/<\\\/script>/gi, sentinel);
          const scripts = [...protectedHtml.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]));
          if (!scripts.length) throw new Error('No inline dashboard scripts found.');
          scripts.forEach((match, index) => {
            const path = `/tmp/dashboard-inline-${index + 1}.js`;
            fs.writeFileSync(path, match[2].replaceAll(sentinel, '<\\/script>'));
            console.log(`Checking inline script ${index + 1}/${scripts.length}: ${path}`);
            require('child_process').execFileSync(process.execPath, ['--check', path], { stdio: 'inherit' });
          });
          // Count parsed HTML script blocks, not tag-like strings embedded inside JavaScript templates.
          console.log(`Validated ${scripts.length} inline JavaScript blocks; escaped HTML snippets are intentionally ignored.`);
          NODE
          test -s public/sw.js
      - name: Check inline JavaScript syntax in Surat Lainnya HTML
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('public/surat-lainnya.html', 'utf8');
          const openTag = '<script>';
          const closeTag = '</script>';
          const start = html.indexOf(openTag);
          const end = html.indexOf(closeTag, start + openTag.length);
          if (start < 0 || end < 0 || html.indexOf(openTag, end + closeTag.length) >= 0) {
            throw new Error('Expected exactly one inline Surat Lainnya script.');
          }
          new vm.Script(html.slice(start + openTag.length, end), { filename: 'public/surat-lainnya.html:inline-script' });
          console.log('PASS Surat Lainnya inline JavaScript syntax');
          NODE
      - name: Validate team intake pages and API contracts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          for (const file of ['public/tim-pendataan.html', 'public/kelola-tim.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const start = html.indexOf('<script>');
            const end = html.indexOf('</script>', start + 8);
            if (start < 0 || end < 0 || html.indexOf('<script>', end + 9) >= 0) {
              throw new Error('Expected exactly one inline script in ' + file);
            }
            new vm.Script(html.slice(start + 8, end), { filename: file + ':inline-script' });
            console.log('PASS inline JavaScript syntax: ' + file);
          }
          const worker = fs.readFileSync('src/index.ts', 'utf8');
          const dashboard = fs.readFileSync('public/index.html', 'utf8');
          const intake = fs.readFileSync('public/tim-pendataan.html', 'utf8');
          const manager = fs.readFileSync('public/kelola-tim.html', 'utf8');
          const config = fs.readFileSync('wrangler.toml', 'utf8');
          const checks = [
            ['team and combined questionnaire routes exist', worker.includes('/api/team-petugas') && worker.includes('/api/team-petugas/password') && worker.includes('/api/team-login') && worker.includes('/api/team-me') && worker.includes('/api/team-profile') && worker.includes('/api/team-questionnaire') && worker.includes('/api/team-submissions') && worker.includes('/api/questionnaires/stage1')],
            ['team access tokens, password hashes, login limits, and reset route are secure', worker.includes('token_hash TEXT NOT NULL UNIQUE') && worker.includes('hashTeamToken(token)') && worker.includes('passwordHash(password, passwordSalt)') && worker.includes('password_hash,password_salt') && worker.includes('team_login_attempts') && worker.includes('attemptNow - 900') && worker.includes('/api/team-petugas/password')],
            ['owner and team data share the response sheet and stage 1 endpoint', worker.includes('const appendRange = encodeURIComponent(tabName + "!A:O")') && worker.includes('TELAH DIDATA OLEH') && worker.includes('url.pathname === "/api/questionnaires/stage1"') && dashboard.includes('DATA KUISIONER THP 1')],
            ['field page captures respondent photos with device camera controls', intake.includes('capture="user"') && intake.includes('capture="environment"')],
            ['team onboarding and repeat login use separate proof and private sessions', worker.includes('normalizeName(name) !== normalizeName(petugas.display_name)') && worker.includes('team_session=') && worker.includes('HttpOnly; Secure; SameSite=Strict') && worker.includes('profile_completed=1,token_hash=?') && worker.includes('passwordHash(password, unhex(candidate.password_salt)')],
            ['team profile is mandatory and accepts up to 10 MB', worker.includes('file.size > 10 * 1024 * 1024') && worker.includes('profile_completed=1') && intake.includes('maksimal 10 MB')],
            ['team profile upload uses private Cloudflare KV storage', worker.includes('TEAM_PROFILE_PHOTOS.put(objectKey') && worker.includes('kv:v1:') && worker.includes('readPrivateTeamPhoto(env, petugas.profile_photo_id)') && !worker.includes('googleDriveMultipartUpload(accessToken, metadata, file)')],
            ['private profile photo KV namespace is bound to Worker environments', config.includes('binding = "TEAM_PROFILE_PHOTOS"') && config.includes('id = "4ee60e8a308e49dab069993b096a137b"')],
            ['admin page requires existing admin session and supports owner password reset', manager.includes("jsonFetch('/api/me')") && manager.includes("['owner','admin']") && manager.includes('teamPasswordDialog') && manager.includes('/api/team-petugas/password')],
            ['dashboard has no legacy Tim Petugas navigation item and links existing member password tools', !dashboard.includes('openTeamManagement') && !dashboard.includes('tim-petugas.html') && dashboard.includes('Kelola Tim Petugas / Atur Kata Sandi')],
            ['staff roster page and protected profile endpoint exist', fs.existsSync('public/daftar-petugas.html') && worker.includes('/api/team-petugas-photo') && worker.includes('has_profile_photo')]
          ];
          for (const [label, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + label);
            if (!ok) process.exitCode = 1;
          }
          NODE
      - name: Validate respondent questionnaire intro and QR destinations
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const intro = fs.readFileSync('public/kuisioner-responden.html', 'utf8');
          const introCss = fs.readFileSync('public/kuisioner-pilihan.css', 'utf8');
          const dashboard = fs.readFileSync('public/index.html', 'utf8');
          const offline = fs.readFileSync('android-app/app/src/main/assets/offline.html', 'utf8');
          const internalForm = fs.readFileSync('public/kuesioner-mandiri.html', 'utf8');
          const internalScripts = [...internalForm.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(match => !/\bsrc\s*=/.test(match[1]));
          if (internalScripts.length !== 1) throw new Error('Expected exactly one inline script in the public integrated questionnaire.');
          new vm.Script(internalScripts[0][2], { filename: 'public/kuesioner-mandiri.html:inline-script' });
          console.log('PASS inline JavaScript syntax: public/kuesioner-mandiri.html');
          const activity = fs.readFileSync('android-app/app/src/main/java/id/sahabatodhiv/sumut/MainActivity.java', 'utf8');
          const checks = [
            ['questionnaire chooser offers both paths without automatic redirect', intro.includes('href="/kuesioner-mandiri.html"') && intro.includes('https://docs.google.com/forms/d/e/1FAIpQLSfugEp7XQ_YmR9PQNEqLjtm-wilOqlUvF7hW_ewSOt_2Y_guw/viewform') && introCss.includes('.choice-grid') && !intro.includes('window.location.replace(destination)')],
            ['questionnaire chooser never forces a timed redirect', !intro.includes('window.setTimeout(finish') && !intro.includes('window.location.replace(destination)')],
            ['questionnaire chooser offers both routes and preserves four local agency logos', intro.includes('Google Forms') && intro.includes('Formulir Sahabat ODHIV Sumut') && intro.includes('/logos/kemensos.png') && intro.includes('/logos/sumut.png') && intro.includes('/logos/ribbon.png') && intro.includes('/logos/kemenkes.png')],
            ['public integrated questionnaire uses no-login API, consent, and anti-spam field', internalForm.includes('/api/public-questionnaire') && internalForm.includes('name="consent"') && internalForm.includes('name="website"') && internalForm.includes('Foto KTP') && !internalForm.includes('team-login')],
            ['dashboard login opens without animated intro', !dashboard.includes('startCollaborationIntro') && !dashboard.includes('collab-intro')],
            ['native app has no animated splash or artificial delay', !activity.includes('AnimatedSplashView') && !activity.includes('3000L') && activity.includes('setContentView(webView);')],
            ['Android WebView uses the canonical HTTPS domain', activity.includes('https://sahabatodhivsumut.web.id/') && activity.includes('DASHBOARD_HOST = "sahabatodhivsumut.web.id"') && !activity.includes('sahabatodhiv-sumut.aryprayoga139.workers.dev')],
            ['dashboard questionnaire links and QR use the canonical HTTPS domain', dashboard.includes('https://sahabatodhivsumut.web.id/kuisioner-responden.html') && !dashboard.includes('sahabatodhiv-sumut.aryprayoga139.workers.dev')],
            ['Android offline recovery uses the canonical HTTPS domain', offline.includes('https://sahabatodhivsumut.web.id/') && !offline.includes('sahabatodhiv-sumut.aryprayoga139.workers.dev')],
            ['dashboard uses the local Kemensos logo and canonical questionnaire link', dashboard.includes('kuisioner-responden.html') && !dashboard.includes('upload.wikimedia.org') && dashboard.includes('/logos/kemensos.png')],
            ['old short form link removed', !dashboard.includes('9YuWSVtgpcSed5St5')],
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (!ok) process.exitCode = 1;
          }
          NODE
      - name: Validate final polish, upload allowlist, and security headers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const worker = fs.readFileSync('src/index.ts', 'utf8');
          const questionnaire = fs.readFileSync('public/kuesioner.html', 'utf8');
          const waiting = fs.readFileSync('public/kuisioner-responden.html', 'utf8');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const letter = fs.readFileSync('public/surat-lainnya.html', 'utf8');
          const letterCss = fs.readFileSync('public/surat-lainnya-layout.css', 'utf8');
          const adminScript = fs.readFileSync('scripts/setup-admin.sh', 'utf8');
          const workflow = fs.readFileSync('.github/workflows/validate-deploy.yml', 'utf8');
          const theme = fs.readFileSync('public/transparent-theme.css', 'utf8');
          const layout = fs.readFileSync('public/app-layout.css', 'utf8');
          const qrCenterCss = fs.readFileSync('public/respondent-qr-center-v1.css', 'utf8');
          const checks = [
            ['legacy inline CSS is removed and shared glass theme is centralized', !/<style\b/i.test(html) && /href="\/app-layout\.css\?v=2\.0\.\d+"/.test(html) && html.includes('href="/transparent-theme.css?v=2.0.0"') && theme.includes('--sahabat-glass-blur:16px') && theme.includes('rgba(15,23,42,.70)') && theme.includes('color:#fff!important') && !layout.includes('#063a7d') && !layout.includes('rgba(13,110,253')],
            ['Form Asesmen Terintegrasi retains the supplied Kemensos PNG and local ATENSI logo', html.includes('src="/logos/kemensos.png"') && html.includes('src="/atensi.svg"') && html.includes('id="assessmentPaper"')],
            ['questionnaire uses the shared glass theme without legacy inline CSS', !/<style\b/i.test(questionnaire) && questionnaire.includes('href="/kuesioner-layout.css?v=2.0.0"') && questionnaire.includes('href="/transparent-theme.css?v=2.0.0"')],
            ['respondent chooser uses external responsive styling without inline CSS', !/<style\b/i.test(waiting) && waiting.includes('href="/kuisioner-pilihan.css?v=1.0.0"') && waiting.includes('href="/transparent-theme.css?v=2.0.0"')],
            ['public, package, and release versions are synchronized', typeof packageJson.version === 'string' && packageJson.version.length > 0 && html.includes('Versi ' + packageJson.version) && changelog.startsWith('## ' + packageJson.version)],
            ['deployment health and smoke tests use the canonical HTTPS domain', workflow.includes('HEALTH_URL: https://sahabatodhivsumut.web.id/api/health') && workflow.includes('APP_URL: https://sahabatodhivsumut.web.id')],
            ['assessment uses the supplied Kemensos and ATENSI logos', html.includes('src="/logos/kemensos.png"') && html.includes('src="/atensi.svg"') && letter.includes('src="/logos/kemensos.png"')],
            ['Surat Lainnya opens the editable letter based on the provided PDF', html.includes('href="/surat-lainnya.html"') && letter.includes('Penyampaian Informasi Kegiatan Klaster ODHIV Sentra Insyaf Medan') && letter.includes('window.print()') && letter.includes('Langgeng Setiawan')],
            ['Surat Lainnya signature block is aligned right with centered text and A4 print rules', letterCss.includes('@page{size:A4;margin:17mm 17mm 16mm}') && letterCss.includes('margin:30px 0 0 auto') && letterCss.includes('page-break-inside:avoid') && letterCss.includes('signature-title') && letterCss.includes('signature-qr .qr-code') && letterCss.includes('signature-name')],
            ['Surat Lainnya QR links to the supplied Google Doc, uses high error correction, and has a local Kemensos logo', letter.includes('https://api.qrserver.com/v1/create-qr-code/?') && letter.includes('data=https%3A%2F%2Fdocs.google.com%2Fdocument%2Fd%2F1RuoyRlTIEy24zhewd126KYq53olKuHRv-4BUiIoo82U%2Fedit%3Fusp%3Ddrivesdk') && letter.includes('ecc=H') && letter.includes('qzone=4') && letter.includes('class="qr-code"') && letter.includes('src="/logos/kemensos.png" alt="Logo Kemensos"') && !letter.includes('cdnjs.cloudflare.com') && letter.includes('qrFallback') && worker.includes('https://api.qrserver.com')],
            ['three-photo Danau Toba slideshow, cache-busted assets, and version', html.includes('id="danau-toba-slideshow-v1-2-9"') && html.includes('/danau-toba/photo-1.jpg?v=1.2.9') && html.includes('/danau-toba/photo-2.jpg?v=1.2.9') && html.includes('/danau-toba/photo-3.jpg?v=1.2.9') && html.includes('setInterval(next,4500)')],
            ['Kemensos logo is precisely centered over the respondent QR by grid placement', html.includes('respondent-quiz-qr-logo') && html.includes('src="/logos/kemensos.png"') && html.includes('class="respondent-quiz-qr-frame"') && html.includes('href="/respondent-qr-center-v1.css?v=1.0.1"') && /grid-area:\s*1\s*\/\s*1\s*\/\s*2\s*\/\s*2/.test(qrCenterCss) && /place-self:\s*center/.test(qrCenterCss) && /object-position:\s*center center/.test(qrCenterCss)],
            ['respondent QR encodes the exact domain URL with high error correction and quiet zone', (() => { const match = html.match(/<img class="respondent-quiz-qr" src="([^"]+)"/); if (!match) return false; const src = match[1]; return src.startsWith('https://api.qrserver.com/v1/create-qr-code/?') && src.includes('data=https%3A%2F%2Fsahabatodhivsumut.web.id%2Fkuisioner-responden.html') && src.includes('size=600x600') && src.includes('ecc=H') && src.includes('qzone=4') && html.includes('src="/logos/kemensos.png" alt="Logo Kementerian Sosial Republik Indonesia"'); })()],
            ['respondent QR uses high-resolution source and local center-layout stylesheet', html.includes('size=600x600') && html.includes('ecc=H') && html.includes('href="/respondent-qr-center-v1.css?v=1.0.1"') && qrCenterCss.includes('background: #fff !important')],
            ['camera and document upload choices', html.includes('application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document') && html.includes('capture="environment"')],
            ['server validates PDF/DOC/DOCX upload MIME', worker.includes('application/pdf", "application/msword", "application/vnd.openxmlformats-officedocument.wordprocessingml.document')],
            ['private file route requires an admin session', worker.includes('url.pathname === "/api/respondent-file"') && worker.includes('Peran tidak diizinkan mengakses berkas responden.')],
            ['WhatsApp template has respondent name and time greeting', html.includes('const respondentName=') && html.includes("const greeting=hour>=4&&hour<11?'pagi'") && html.includes('Deny Arifin Martyon')],
            ['Content-Security-Policy configured', worker.includes('content-security-policy') && worker.includes("frame-ancestors 'none'")],
            ['news links require trusted HTTPS publisher URLs in backend and dashboard', worker.includes('safeNewsUrl(candidateUrl)') && worker.includes('item.title && item.url && item.category') && html.includes('function safeNewsArticleUrl(value)') && html.includes('const articleUrl=safeNewsArticleUrl(item.url)')],
            ['API replies have a default-deny CSP and same-origin response policy', worker.includes("default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'") && worker.includes('"cross-origin-resource-policy": "same-origin"') && worker.includes('"x-permitted-cross-domain-policies": "none"')],
            ['owner bootstrap enforces stronger passwords and secure helper contract', worker.includes('password.length < 14') && worker.includes('password minimal 14 karakter') && adminScript.includes('read -r -s -p "Password owner') && adminScript.includes('X-Owner-Bootstrap-Token') && adminScript.includes('Origin: $ORIGIN') && adminScript.includes('sahabatodhivsumut.web.id') && !adminScript.includes('PASSWORD="$3"') && !adminScript.includes('dashboard-bnba-odhiv-sumut.aryprayoga139.workers.dev')],
            ['notification logging redacts raw exception messages', worker.includes(`notification_record_failed", { action, stage: "record" }`) && !worker.includes(`notification_record_failed", { action, message:`)],
            ['copyright notice visible', html.includes('© 2026 Data Base Kemensos RI DRSKPNO')],
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (!ok) process.exitCode = 1;
          }
          NODE
      - name: Validate push notification enrollment and delivery handlers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const sw = fs.readFileSync('public/sw.js', 'utf8');
          const worker = fs.readFileSync('src/index.ts', 'utf8');
          const checks = [
            ['owner notification panel exists', html.includes('id="pushNotificationPanel"') && html.includes('id="enablePushNotifications"')],
            ['browser permission and PushManager subscription', html.includes('Notification.requestPermission()') && html.includes('registration.pushManager.subscribe')],
            ['subscription uses CSRF protection', html.includes("fetch('/api/push-subscriptions',{method:'POST'") && html.includes("'X-CSRF-Token':csrfToken")],
            ['test button targets actual Worker endpoint', html.includes("fetch('/api/push-test',{method:'POST'") && worker.includes('url.pathname === "/api/push-test"')],
            ['service worker receives and displays push', sw.includes("addEventListener('push'") && sw.includes('showNotification')],
            ['push notifications request vibration', sw.includes('vibrate:[250,120,250,120,350]')],
            ['dashboard has no animated intro', !html.includes('startCollaborationIntro') && !html.includes('collab-intro') && !html.includes('await startCollaborationIntro')],
            ['push test remains queued unless delivery is confirmed', worker.includes('push_test_pending') && worker.includes('delivery.configured && delivery.subscriptions > 0 && delivery.failed === 0') && worker.includes('Promise<{ configured: boolean; subscriptions: number; failed: number }>')],
            ['push delivery logs avoid exposing provider exception details', worker.includes('Do not log provider exception text') && worker.includes('console.warn("push_delivery_failed", { stage: "request" })')],
            ['Worker stores subscriptions and polls form response rows', worker.includes('INSERT INTO push_subscriptions') && worker.includes("state_key='response_row_count'")],
            ['push enrollment does not require private signing key on receiver', worker.includes('enabled: !!(env.VAPID_PUBLIC_KEY && env.VAPID_SUBJECT)')],
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (!ok) process.exitCode = 1;
          }
          NODE
      - name: Validate single scheduled poller and push-key alignment
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('wrangler.toml', 'utf8');
          if (!config.includes('name = "sahabatodhiv-sumut"')) throw new Error('Default Wrangler target must be sahabatodhiv-sumut.');
          if (!config.includes('APP_ORIGIN = "https://sahabatodhivsumut.web.id"')) throw new Error('Default APP_ORIGIN must match the canonical custom domain.');
          if (!config.includes('WEBAUTHN_RP_ID = "sahabatodhivsumut.web.id"')) throw new Error('Default WebAuthn RP ID must match the canonical custom domain.');
          if (!config.includes('workers_dev = false')) throw new Error('The primary Worker must not expose a parallel workers.dev hostname.');
          if (!config.includes('routes = [{ pattern = "sahabatodhivsumut.web.id", custom_domain = true }]')) throw new Error('Wrangler must declare the production custom domain.');
          if (!config.includes('[assets]\ndirectory = "./public"\nbinding = "ASSETS"\nrun_worker_first = true')) throw new Error('Static assets must pass through the Worker so security headers are applied.');

          const blocks = [
            ['root cron disabled', '[triggers]\ncrons = []'],
            ['Sahabat primary', '[env.sahabatodhiv-sumut.triggers]\ncrons = ["* * * * *"]'],
            ['production alias', '[env.production.triggers]\ncrons = []'],
            ['staging', '[env.staging.triggers]\ncrons = []'],
          ];
          for (const [name, text] of blocks) {
            if (!config.includes(text)) throw new Error(name + ' cron configuration is incorrect.');
          }
          if (config.split('crons = ["* * * * *"]').length - 1 !== 1) throw new Error('Exactly one Worker must own the one-minute poller.');
          console.log('PASS canonical Sahabat default and exactly one scheduled poller');
          NODE
      - name: Validate Sahabat ODHIV Wrangler configuration (dry run)
        run: npx wrangler deploy --dry-run --env sahabatodhiv-sumut

  deploy:
    name: Deploy and health-check production Worker
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-production]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract Danau Toba slideshow photos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          archive = Path('public/danau-toba-landingpage.zip')
          target = Path('public/danau-toba')
          if not archive.is_file():
              raise SystemExit('Missing public/danau-toba-landingpage.zip')
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              photos = [item for item in z.infolist() if not item.is_dir() and item.filename.lower().endswith(('.jpg', '.jpeg'))]
              if len(photos) != 7:
                  raise SystemExit(f'Expected exactly 7 JPG photos, found {len(photos)}')
              for index, item in enumerate(photos, 1):
                  with z.open(item) as src, (target / f'photo-{index}.jpg').open('wb') as dst:
                      shutil.copyfileobj(src, dst)
          print('Extracted 7 Danau Toba slideshow photos.')
          PY
      - name: Assemble owner dashboard background image
        run: |
          set -euo pipefail
          test -d .build-assets/owner-background
          cat .build-assets/owner-background/part-*.b64 | tr -d '\r\n' | base64 --decode > public/owner-background.webp
          python3 - <<'PY'
          from pathlib import Path
          asset = Path("public/owner-background.webp")
          data = asset.read_bytes()
          if len(data) < 10000 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
              raise SystemExit("Owner background asset is not a valid WebP image.")
          print(f"Owner background asset verified: {len(data)} bytes.")
          PY
      - name: Install dependencies
        run: npm install
      - name: Bundle PDF generator within the same-origin assets
        run: |
          set -euo pipefail
          mkdir -p public/vendor
          test -s node_modules/pdf-lib/dist/pdf-lib.min.js
          cp node_modules/pdf-lib/dist/pdf-lib.min.js public/vendor/pdf-lib.min.js
          test -s public/vendor/pdf-lib.min.js
          echo "Bundled self-hosted pdf-lib browser runtime."
      - name: Check Cloudflare secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN in GitHub Actions secrets/environment." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets/environment." && exit 1)
      - name: Deploy Sahabat ODHIV Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env sahabatodhiv-sumut
      - name: Verify Sahabat ODHIV backend health
        env:
          HEALTH_URL: https://sahabatodhivsumut.web.id/api/health
        run: |
          for attempt in $(seq 1 10); do
            response="$(curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$response" | node -e '
              let data = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                try {
                  const result = JSON.parse(data);
                  if (result.ok === true && result.database === "connected" && result.mode === "ready") process.exit(0);
                } catch {}
                process.exit(1);
              });
            '; then
              echo "Sahabat ODHIV backend health check passed: $response"
              exit 0
            fi
            echo "Sahabat health check attempt $attempt/10 failed; retrying in 6 seconds."
            sleep 6
          done
          echo "::error::Sahabat ODHIV backend health check did not confirm ok=true, database=connected, mode=ready."
          exit 1
      - name: Verify Sahabat ODHIV public page and protected respondent endpoint
        env:
          APP_URL: https://sahabatodhivsumut.web.id
        run: |
          page_status="000"
          for attempt in $(seq 1 12); do
            if page_status="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --dump-header /tmp/sahabat-headers.txt --output /tmp/sahabat-dashboard.html --write-out '%{http_code}' "$APP_URL/?v=$GITHUB_SHA" -H 'Cache-Control: no-cache')"; then :; else page_status="000"; fi
            if [ "$page_status" = "200" ] && grep -Fq 'href="/app-layout.css?v=2.0.6"' /tmp/sahabat-dashboard.html && grep -Fq 'href="/transparent-theme.css?v=2.0.0"' /tmp/sahabat-dashboard.html && grep -Fq 'href="/dashboard-card-clean-v1.css?v=1.1.49"' /tmp/sahabat-dashboard.html && grep -Fq 'href="/assessment-glass-layout-v1.css?v=1.1.52"' /tmp/sahabat-dashboard.html && grep -Fq 'name="application-version" content="1.1.59"' /tmp/sahabat-dashboard.html && grep -Fq 'href="/single-layer-floating-dashboard-v1.css?v=1.1.57"' /tmp/sahabat-dashboard.html && grep -Fq 'RANCANGAN ANGGARAN BELANJA' /tmp/sahabat-dashboard.html && grep -Fq 'RAB NUTRISI' /tmp/sahabat-dashboard.html && grep -Fq 'RAB KEWIRAUSAHAAN' /tmp/sahabat-dashboard.html && grep -Fq 'id="rabHomeChoices" hidden' /tmp/sahabat-dashboard.html && grep -Fq 'id="questionnaireHubView" hidden' /tmp/sahabat-dashboard.html && grep -Fq 'id="teamQuestionnaireView" hidden' /tmp/sahabat-dashboard.html && grep -Fq 'id="stage1DataView" hidden' /tmp/sahabat-dashboard.html && grep -Fq 'KUISIONER OWNER' /tmp/sahabat-dashboard.html && grep -Fq 'KUISIONER TIM KERJA' /tmp/sahabat-dashboard.html && grep -Fq 'DATA KUISIONER THP 1' /tmp/sahabat-dashboard.html && grep -Fq 'Kosongkan Lembar Asesmen' /tmp/sahabat-dashboard.html && grep -Fq 'data-photo-preview="assessmentPhotoHome"' /tmp/sahabat-dashboard.html; then
              echo "Production page and centralized glass theme references are current (attempt $attempt)."
              break
            fi
            echo "Waiting for production Worker/asset propagation (attempt $attempt/12, HTTP $page_status)."
            sleep 5
          done
          test "$page_status" = "200" || (echo "::error::Sahabat dashboard page returned HTTP $page_status after retries." && exit 1)
          owner_css_response="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-owner-layout.css --write-out '%{http_code}|%{content_type}' "$APP_URL/single-layer-floating-dashboard-v1.css?v=1.1.57&verify=$GITHUB_SHA")"
          owner_css_status="${owner_css_response%%|*}"
          owner_css_type="${owner_css_response#*|}"
          test "$owner_css_status" = "200" || (echo "::error::Owner layout CSS returned HTTP $owner_css_status." && exit 1)
          case "$owner_css_type" in text/css*) ;; *) echo "::error::Owner layout CSS has unexpected content type: $owner_css_type." && exit 1 ;; esac
          grep -Fq 'grid-template-areas:"profile summary actions" ". clock clock"!important' /tmp/sahabat-owner-layout.css || (echo "::error::Deployed owner CSS does not align actions with the profile row." && exit 1)
          grep -Fq 'Root-cause correction v1.1.56' /tmp/sahabat-owner-layout.css || (echo "::error::Deployed owner layout CSS is stale." && exit 1)
          grep -Eiq '^strict-transport-security:[[:space:]]*max-age=15552000' /tmp/sahabat-headers.txt || (echo "::error::HSTS header is missing or has unexpected max-age." && exit 1)
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' /tmp/sahabat-headers.txt || (echo "::error::X-Frame-Options DENY is missing." && exit 1)
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' /tmp/sahabat-headers.txt || (echo "::error::X-Content-Type-Options nosniff is missing." && exit 1)
          grep -Eiq '^content-security-policy:[[:space:]]*default-src' /tmp/sahabat-headers.txt || (echo "::error::Content-Security-Policy header is missing." && exit 1)
          grep -Eiq '^cross-origin-resource-policy:[[:space:]]*same-origin' /tmp/sahabat-headers.txt || (echo "::error::Cross-Origin-Resource-Policy same-origin is missing." && exit 1)
          grep -qi '<html' /tmp/sahabat-dashboard.html || (echo "::error::Sahabat dashboard response is not HTML." && exit 1)
          grep -q 'ownerProfileForm' /tmp/sahabat-dashboard.html || (echo "::error::Owner profile UI is missing." && exit 1)
          grep -Fq 'Hapus asesmen' /tmp/sahabat-dashboard.html || (echo "::error::Saved assessment delete action is missing from dashboard HTML." && exit 1)
          ! grep -Eiq 'href="(style|login)\.css\?v=' /tmp/sahabat-dashboard.html || (echo "::error::Legacy stylesheet references returned to the dashboard." && exit 1)
          theme_response="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-theme.css --write-out '%{http_code}|%{content_type}' "$APP_URL/transparent-theme.css?v=2.0.0&verify=$GITHUB_SHA")"
          theme_status="${theme_response%%|*}"
          theme_type="${theme_response#*|}"
          test "$theme_status" = "200" || (echo "::error::Shared glass theme returned HTTP $theme_status." && exit 1)
          case "$theme_type" in text/css*) ;; *) echo "::error::Shared glass theme has unexpected content type: $theme_type." && exit 1 ;; esac
          grep -Fq -- '--sahabat-glass-blur:16px' /tmp/sahabat-theme.css || (echo "::error::Shared glass theme blur token is missing." && exit 1)
          grep -Fq -- '--sahabat-glass-bg:rgba(15,23,42,.70)' /tmp/sahabat-theme.css || (echo "::error::Shared glass surface token is missing." && exit 1)
          grep -Fq 'color:#fff!important' /tmp/sahabat-theme.css || (echo "::error::Shared glass theme white typography rule is missing." && exit 1)
          card_css_response="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-card-clean.css --write-out '%{http_code}|%{content_type}' "$APP_URL/dashboard-card-clean-v1.css?v=1.1.49&verify=$GITHUB_SHA")"
          card_css_status="${card_css_response%%|*}"
          card_css_type="${card_css_response#*|}"
          test "$card_css_status" = "200" || (echo "::error::Dashboard card cleanup CSS returned HTTP $card_css_status." && exit 1)
          case "$card_css_type" in text/css*) ;; *) echo "::error::Dashboard card cleanup CSS has unexpected content type: $card_css_type." && exit 1 ;; esac
          grep -Fq 'backdrop-filter: none !important' /tmp/sahabat-card-clean.css || (echo "::error::Dashboard card cleanup blur override is missing." && exit 1)
          grep -Fq '#notificationBellButton' /tmp/sahabat-card-clean.css || (echo "::error::Owner action-icon cleanup is missing." && exit 1)
          assessment_css_response="$(curl --connect-timeout 5 --max-time 20 --silent --show-error --output /tmp/sahabat-assessment-glass.css --write-out '%{http_code}|%{content_type}' "$APP_URL/assessment-glass-layout-v1.css?v=1.1.52&verify=$GITHUB_SHA")"
          assessment_css_status="${assessment_css_response%%|*}"
