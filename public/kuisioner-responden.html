<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#384B38">
<title>Kuisioner Responden — Sahabat ODHIV Sumut</title>
<style>
:root{color-scheme:dark;--olive:#384B38;--red:#FF1D25;--cyan:#53CBEB;--blue:#1170C0;--navy:#0B2D6B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;color:#fff;background:radial-gradient(ellipse at 50% 42%,#15538b 0%,var(--navy) 62%,#06152f 100%)}
.intro{width:min(100%,720px);padding:clamp(14px,4vw,28px);text-align:center}
.scene{position:relative;width:100%;height:min(62svh,440px);min-height:280px;overflow:hidden;border-radius:24px;background:linear-gradient(#65c9ef 0%,#b9edff 65%,#e7f8ff 66%,#d9edc3 100%);box-shadow:0 18px 60px #0005}
.cloud{position:absolute;color:#fff;opacity:.8;font-size:clamp(28px,7vw,54px);animation:cloudDrift 12s ease-in-out infinite alternate}
.cloud.one{left:8%;top:12%}.cloud.two{right:12%;top:23%;animation-delay:-4s}
.sun{position:absolute;right:13%;top:8%;width:clamp(34px,8vw,58px);aspect-ratio:1;border-radius:50%;background:#fff0a3;box-shadow:0 0 32px #fff5a5}
.kite{position:absolute;left:65%;top:13%;width:clamp(52px,13vw,90px);height:auto;animation:kiteFloat 2.4s ease-in-out infinite}
.kite path{stroke:#fff;stroke-width:1.5}
.ground{position:absolute;left:-5%;right:-5%;bottom:-12%;height:35%;border-radius:50% 50% 0 0;background:linear-gradient(#91c77c,#4d8c55)}
.child{position:absolute;bottom:13%;width:clamp(100px,24vw,156px);height:auto;overflow:visible}
.child.tall{left:24%;z-index:2;animation:bodyRun .42s ease-in-out infinite alternate}
.child.short{left:49%;width:clamp(82px,20vw,128px);z-index:2;animation:bodyRun .38s ease-in-out infinite alternate-reverse}
.leg,.arm{transform-box:fill-box;transform-origin:top center}
.tall .shirt{fill:var(--olive)}.short .shirt{fill:var(--blue)}
.tall .leg-a,.short .leg-a{animation:legA .42s ease-in-out infinite alternate}
.tall .leg-b,.short .leg-b{animation:legB .42s ease-in-out infinite alternate}
.tall .arm-a,.short .arm-a{animation:armA .42s ease-in-out infinite alternate}
.tall .arm-b,.short .arm-b{animation:armB .42s ease-in-out infinite alternate}
.brand{display:grid;justify-items:center;gap:10px;padding:12px 8px 4px;opacity:0;transform:translateY(14px) scale(.96);animation:brandIn .9s ease-out 3.35s forwards}
.mark{width:clamp(62px,16vw,92px);height:clamp(62px,16vw,92px);display:grid;place-items:center;border:3px solid #ffffffcc;border-radius:24px;background:#ffffff14;box-shadow:0 0 32px #53cbeb55}
.mark svg{width:70%;height:70%}
.brand h1{margin:0;font-size:clamp(1.25rem,5vw,2rem);letter-spacing:.035em}
.slogan{margin:0;color:#bceeff;font-size:clamp(.8rem,2.8vw,1rem)}
.status{margin:10px 0 0;color:#d8eaff;font-size:.9rem}
.scene{animation:sceneOut .7s ease-in 3.3s forwards}
@keyframes legA{to{transform:rotate(34deg)}}@keyframes legB{to{transform:rotate(-34deg)}}
@keyframes armA{to{transform:rotate(-30deg)}}@keyframes armB{to{transform:rotate(30deg)}}
@keyframes bodyRun{to{translate:0 -7px}}
@keyframes kiteFloat{0%,100%{translate:0 0;rotate:-5deg}50%{translate:7px -10px;rotate:6deg}}
@keyframes cloudDrift{to{translate:22px 0}}
@keyframes sceneOut{to{opacity:0;transform:scale(.96);visibility:hidden}}
@keyframes brandIn{to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important}}
</style>
</head>
<body>

   <path d="M69 46 h4 M88 46 h4" stroke="#2b211d" stroke-width="3" stroke-linecap="round"/><path d="M74 57 Q80 62 87 56" fill="none" stroke="#7d3f32" stroke-width="2" stroke-linecap="round"/>
  </svg>
 </section>
 <section class="brand" aria-label="Sahabat ODHIV Sumut">

  <h1>Sahabat ODHIV Sumut</h1>
