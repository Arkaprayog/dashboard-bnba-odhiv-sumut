<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#063a76">
<title>Membuka Kuisioner Responden — Sahabat ODHIV Sumut</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;color:#fff;background:radial-gradient(ellipse at 50% 48%,#0d4b86 0%,#052b56 53%,#03162f 100%)}
.intro{width:min(94vw,620px);text-align:center;padding:22px}
.scene{position:relative;height:min(62vh,440px);min-height:310px;display:grid;place-items:center}
.orbit{position:absolute;left:50%;top:50%;border:2px solid transparent;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 14px #00bcff30}
.a{width:92%;height:64%;border-top-color:#00c9ff;border-right-color:#1f8bff;animation:spin 1.25s linear infinite}
.b{width:80%;height:82%;border-bottom-color:#17d58b;border-left-color:#f6c91a;animation:spinrev 1.6s linear infinite}
.c{width:68%;height:96%;border-top-color:#ffc920e6;border-bottom-color:#00beffb3;animation:spin 2s linear infinite}
.logo{position:absolute;object-fit:contain;background:#fffF;padding:9px;border-radius:14px;box-shadow:0 0 16px #00beff55}
.kemensos{width:clamp(72px,17vw,108px);height:clamp(72px,17vw,108px);top:1%;left:50%;animation:one 3s ease-in-out both}
.sumut{width:clamp(72px,16vw,104px);height:clamp(72px,16vw,104px);right:1%;top:5%;animation:two 3s ease-in-out both}
.kemenkes{width:clamp(92px,20vw,132px);height:clamp(55px,12vw,76px);left:0;bottom:12%;animation:three 3s ease-in-out both}
.ribbon{width:54px;height:72px;right:1%;top:39%;padding:0;background:transparent;animation:four 3s ease-in-out both}
.word{position:relative;z-index:3;font-size:clamp(1.3rem,5vw,2.3rem);font-weight:800;letter-spacing:.12em;text-shadow:0 0 22px #23b3ffb3;animation:appear .5s ease-out both}
.caption{font-size:clamp(.85rem,2.5vw,1rem);color:#d6efff;letter-spacing:.04em}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes spinrev{to{transform:translate(-50%,-50%) rotate(-360deg)}}
@keyframes appear{from{opacity:0;transform:scale(.8);letter-spacing:.3em}to{opacity:1;transform:scale(1);letter-spacing:.12em}}
@keyframes one{0%{top:1%;left:50%;transform:translateX(-50%) rotate(0) scale(.8)}35%{top:65%;left:76%;transform:translateX(-50%) rotate(240deg) scale(1.05)}70%{top:26%;left:23%;transform:translateX(-50%) rotate(500deg)}100%{top:1%;left:50%;transform:translateX(-50%) rotate(720deg) scale(.9)}}
@keyframes two{0%{opacity:0;transform:translate(45px,-40px) rotate(-180deg) scale(.3)}20%{opacity:1}58%{transform:translate(-75px,65px) rotate(180deg) scale(1.08)}100%{opacity:1;transform:translate(0,0) rotate(360deg) scale(1)}}
@keyframes three{0%,8%{transform:translate(-18px,22px) rotate(-15deg);opacity:0}28%{transform:translate(15px,-8px) rotate(12deg);opacity:1}65%{transform:translate(90px,-55px) rotate(180deg);opacity:1}100%{transform:translate(0,0) rotate(360deg);opacity:1}}
@keyframes four{0%,18%{transform:translateY(20px) rotate(0) scale(.6);opacity:0}38%{transform:translateY(-10px) rotate(25deg) scale(1);opacity:1}72%{transform:translate(-90px,55px) rotate(190deg) scale(.85);opacity:1}100%{transform:translate(0,0) rotate(360deg);opacity:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="intro" aria-live="polite">
 <div class="scene" aria-label="Animasi empat logo kolaborasi">
  <span class="orbit a"></span><span class="orbit b"></span><span class="orbit c"></span>
  <img class="logo kemensos" src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Logo_of_the_Ministry_of_Social_Affairs_of_the_Republic_of_Indonesia.svg/960px-Logo_of_the_Ministry_of_Social_Affairs_of_the_Republic_of_Indonesia.svg.png" alt="Kementerian Sosial">
  <img class="logo sumut" src="https://sumutprov.go.id/images/tentangpemprovsu/Lambang%20Sumut.jpg" alt="Provinsi Sumatera Utara">
  <img class="logo kemenkes" src="https://commons.wikimedia.org/wiki/Special:FilePath/Logo_Kementerian_Kesehatan_Republik_Indonesia_%282024_rev%29.svg" alt="Kementerian Kesehatan">
  <svg class="logo ribbon" viewBox="0 0 36 52" role="img" aria-label="Pita solidaritas"><path d="M9 3 C1 8 5 18 11 25 L2 43 L9 49 L18 31 L27 49 L34 43 L24 25 C31 16 35 7 27 3 C20 -1 17 5 18 10 C18 5 14 0 9 3Z" fill="#ff3038"/><path d="M10 8 C12 4 17 7 18 12 C19 7 24 4 27 8 C29 12 25 19 18 26 C11 19 7 12 10 8Z" fill="#e51f32"/></svg>
  <div class="word">SAHABAT ODHIV SUMUT</div>
 </div>
 <p class="caption">Menyiapkan Kuisioner Responden…</p>
 <p class="caption">Mohon tunggu 3 detik</p>
</main>
<script>
const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSfugEp7XQ_YmR9PQNEqLjtm-wilOqlUvF7hW_ewSOt_2Y_guw/viewform';
window.setTimeout(()=>{window.location.replace(FORM_URL)},3000);
</script>
</body></html>
