<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#075b9a">
<title>Menghubungkan Kuesioner</title>
<style>
:root{color-scheme:dark;--cyan:#54e6ff;--blue:#0878c9}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#063a76 url("/danau-toba/photo-1.jpg?v=1.3.0") center center/cover no-repeat;color:#fff;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(3,28,54,.06),rgba(2,27,51,.22) 52%,rgba(0,29,60,.38));pointer-events:none}
.stage{position:absolute;inset:0;z-index:1;display:grid;place-items:center;padding:24px 18px 52px;perspective:1000px}
.cube{position:relative;z-index:2;width:clamp(170px,52vw,230px);height:clamp(170px,52vw,230px);transform-style:preserve-3d;animation:cube-spin 3s linear infinite;filter:none;visibility:visible;opacity:1}
.face{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;border:0;border-radius:22px;background:transparent;backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);box-shadow:none;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face svg,.face img{display:block;width:76%;height:76%;object-fit:contain;overflow:visible;visibility:visible;opacity:1;background:transparent;filter:drop-shadow(0 3px 5px rgba(0,25,65,.18))}
.front{transform:translateZ(92px)}.right{transform:rotateY(90deg) translateZ(92px)}.back{transform:rotateY(180deg) translateZ(92px)}.left{transform:rotateY(-90deg) translateZ(92px)}
.orbit{position:absolute;width:clamp(255px,76vw,370px);height:clamp(100px,28vw,140px);border:2px solid rgba(91,237,255,.82);border-left-color:rgba(91,237,255,.14);border-right-color:rgba(91,237,255,.14);border-radius:50%;transform:rotate(-17deg);box-shadow:0 0 12px rgba(84,230,255,.45),inset 0 0 12px rgba(84,230,255,.14);animation:orbit-pulse 2.3s ease-in-out infinite;pointer-events:none}
.loading{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(72vw,410px);height:5px;border-radius:99px;background:rgba(255,255,255,.36);overflow:hidden;box-shadow:0 0 12px rgba(0,30,60,.2)}
.loading span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#5ce8ff,#b9f8ff);box-shadow:0 0 10px rgba(84,230,255,.85);animation:load 3s linear forwards}
.final-logo{display:none;position:fixed;inset:0;background:#fff;align-items:center;justify-content:center;padding:32px;z-index:5;opacity:0}
.final-logo img{display:block;width:min(68vw,320px);max-height:55vh;object-fit:contain;background:transparent}
body.final-screen{background:#fff}
body.final-screen::before,body.final-screen .stage,body.final-screen .loading{display:none}
body.final-screen .final-logo{display:flex;animation:final-in .18s ease-out forwards}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes cube-spin{0%{transform:rotateX(-12deg) rotateY(0deg)}100%{transform:rotateX(-12deg) rotateY(360deg)}}
@keyframes orbit-pulse{0%,100%{opacity:.66;scale:.96}50%{opacity:1;scale:1.03}}
@keyframes load{0%{width:0}100%{width:100%}}
@keyframes final-in{from{opacity:0}to{opacity:1}}
@media(max-width:480px){.stage{padding-bottom:46px}.cube{width:164px;height:164px}.front{transform:translateZ(66px)}.right{transform:rotateY(90deg) translateZ(66px)}.back{transform:rotateY(180deg) translateZ(66px)}.left{transform:rotateY(-90deg) translateZ(66px)}.face{border-radius:17px}.orbit{width:260px;height:100px}}
@media(prefers-reduced-motion:reduce){.cube,.orbit,.loading span{animation-duration:3s}}
</style>

  <style id="readable-wait-screen-v1-1-9">
    :root{color-scheme:light}
    body{color:#163650!important;background:#dfeefa url("/danau-toba/photo-1.jpg?v=1.3.0") center center/cover no-repeat!important}
    body::before{background:linear-gradient(180deg,rgba(248,252,255,.48),rgba(241,248,255,.62) 52%,rgba(230,242,252,.72))!important}
    .loading{background:rgba(22,54,80,.24)!important;box-shadow:none!important}
    .loading span{background:linear-gradient(90deg,#1385c6,#28a7d2)!important;box-shadow:none!important}
    .final-logo{background:#f8fcff!important}
  </style>


<style id="sahabat-global-glass-v1-1-26">
:root{color-scheme:dark!important;--ink:#fff!important;--muted:#fff!important;--line:rgba(255,255,255,.32)!important;--bg:#163847!important;--paper:rgba(3,17,27,.17)!important}
html,body{min-height:100%;background-color:#163847!important}
body{color:#fff!important;background-image:linear-gradient(180deg,rgba(2,15,23,.11),rgba(2,15,23,.24)),url('/dashboard-background.webp?v=1.1.26')!important;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important;background-attachment:fixed!important;text-shadow:0 1px 3px rgba(0,0,0,.22)!important}
body,body *{color:#fff!important;-webkit-text-fill-color:#fff!important}
body:not(.authenticated)::before,body:not(.authenticated)::after{display:none!important;content:none!important}
body :is(input,textarea,select,option,[contenteditable="true"]){background:rgba(2,15,23,.19)!important;color:#fff!important;-webkit-text-fill-color:#fff!important;caret-color:#fff!important;border-color:rgba(255,255,255,.38)!important}
body input::placeholder,body textarea::placeholder{color:#fff!important;-webkit-text-fill-color:#fff!important;opacity:1!important}
body select option{background:#163847!important;color:#fff!important}
body :is(main:not(.paper),header:not(.letterhead),footer,nav,.topbar,.toolbar,.panel,.card,.dashpanel,.overview-card,.overview-panel,.owner-card,.app-nav,.stat,.profile,.staff,.notice,.notice-card,.form-card,.link-box,.table-wrap,.message,.status,.warning,dialog,fieldset,.hero,.quick-card,.workspace-card,.dashboard-card,.settings-panel,.notification-panel,.profile-bar,.login-panel,.menu-card,.info-card,.stat-card,.quick-link,.profile-setup,.section-card,.panel-card,.form,.data-card,.settings-row,.notification-item,.assessment-section-title,.assessment-subtitle,.profile-setup,.link-box,.to,.letter-date-line){color:#fff!important;background:rgba(3,17,27,.19)!important;border-color:rgba(255,255,255,.30)!important;box-shadow:0 12px 34px rgba(0,0,0,.10)!important;backdrop-filter:blur(18px) saturate(118%)!important;-webkit-backdrop-filter:blur(18px) saturate(118%)!important}
body :is(button,.btn,.dashbtn,.top-link,.submit,.primary,.secondary,.workflow-save){color:#fff!important;-webkit-text-fill-color:#fff!important;background:rgba(255,255,255,.075)!important;border:1px solid rgba(255,255,255,.42)!important;box-shadow:0 8px 24px rgba(0,0,0,.08)!important;backdrop-filter:blur(14px)!important;-webkit-backdrop-filter:blur(14px)!important}
body :is(button,.btn,.dashbtn,.top-link,.submit,.primary,.secondary,.workflow-save):hover{background:rgba(255,255,255,.16)!important}
body :is(.muted,.empty,.success,.ok,.error,.danger,.warning,.status,.message,.settings-status,.alert,.pill,.badge,.tag){color:#fff!important;-webkit-text-fill-color:#fff!important;background:rgba(3,17,27,.23)!important;border-color:rgba(255,255,255,.3)!important}
body :is(.app-nav button[aria-current="page"],.active,.selected,[aria-pressed="true"]){background:rgba(255,255,255,.20)!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
body .paper{color:#fff!important;background:rgba(3,17,27,.19)!important;border-color:rgba(255,255,255,.30)!important;box-shadow:0 12px 34px rgba(0,0,0,.10)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important}
body .paper *{color:#fff!important;-webkit-text-fill-color:#fff!important}
body .letterhead{background:transparent!important}
body :is(.owner-avatar,.avatar,.profile-photo){background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.75)!important}
body :is(table,th,td){border-color:rgba(255,255,255,.25)!important}
body :is([hidden],template){display:none!important}
@media(prefers-reduced-transparency:reduce){body :is(main:not(.paper),header:not(.letterhead),footer,nav,.topbar,.toolbar,.panel,.card,.dashpanel,.overview-card,.overview-panel,.owner-card,.app-nav,.stat,.profile,.staff,.notice,.form-card,.table-wrap,.settings-panel,.notification-panel,.paper){backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(3,17,27,.38)!important}}
@media print{
 html,body{background:#fff!important;background-image:none!important;color:#000!important;text-shadow:none!important}
 body,body *{color:#000!important;-webkit-text-fill-color:#000!important;text-shadow:none!important}
 body .paper{background:#fff!important;color:#000!important;border-color:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
 body .paper *{color:#000!important;-webkit-text-fill-color:#000!important}
 body :is(.topbar,.toolbar,.no-print,.editor-panel){display:none!important}
}

/* v1.1.26: unify every interactive surface as lightweight glass, not opaque cards. */
body :is(main:not(.paper),section:not(.paper),article,aside,header:not(.letterhead),footer,nav,form,fieldset,dialog,.card,.panel,.topbar,.toolbar,.workspace,.workspace-card,.dashboard-card,.owner-card,.profile-card,.profile-panel,.settings-panel,.notification-panel,.login-panel,.form-card,.form-panel,.section-card,.panel-card,.info-card,.data-card,.table-wrap,.table-container,.modal,.modal-content,.drawer,.menu-card,.quick-card,.quick-link,.stat-card,.overview-card,.overview-panel,.status-card,.notice-card,.upload-card,.document-card,.assessment-card){background-color:rgba(255,255,255,.075)!important;background-image:none!important;border-color:rgba(255,255,255,.25)!important;box-shadow:0 12px 34px rgba(0,0,0,.10)!important;-webkit-backdrop-filter:blur(18px) saturate(125%)!important;backdrop-filter:blur(18px) saturate(125%)!important}
body :is(input,textarea,select,option,[contenteditable="true"],.input,.field){background-color:rgba(255,255,255,.075)!important;color:#fff!important;-webkit-text-fill-color:#fff!important;border-color:rgba(255,255,255,.30)!important}
body :is(input,textarea,select,option,[contenteditable="true"])::placeholder{color:#fff!important;-webkit-text-fill-color:#fff!important;opacity:1!important}
body :is(.muted,.empty,.success,.ok,.error,.danger,.warning,.status,.message,.settings-status,.alert,.pill,.badge,.tag,.hint,.helper,.caption,.subtitle,.secondary-text){color:#fff!important;-webkit-text-fill-color:#fff!important}
body :is(.profile-actions,.owner-actions,.account-actions,.header-actions,.profile-controls,.action-icons,.icon-actions,.icon-button-group){background:transparent!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
@media print{html,body{background:#fff!important;background-image:none!important;color:#111!important;text-shadow:none!important}body,body *{color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important}body :is(main,section,article,aside,header,footer,nav,form,fieldset,.card,.panel,.paper){background:#fff!important;background-image:none!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-color:transparent!important}}
</style>

</head>
<body>
<main class="stage" aria-label="Menghubungkan ke formulir kuesioner">
  <div class="orbit" aria-hidden="true"></div>
  <div class="cube" aria-hidden="true">
    <div class="face front">
      <img src="/logos/kemenkes.png" alt="Logo Kementerian Kesehatan" width="160" height="116">
    </div>
    <div class="face right">
      <img src="/logos/kemensos.png" alt="Logo Kementerian Sosial">
    </div>
    <div class="face back">
      <img src="/logos/sumut.png" alt="Lambang Pemerintah Provinsi Sumatera Utara" width="129" height="150">
    </div>
    <div class="face left">
      <img src="/logos/ribbon.png" alt="Pita merah dukungan ODHIV" width="71" height="120">
    </div>
  </div>
</main>
<div class="loading" role="progressbar" aria-label="Memuat" aria-valuemin="0" aria-valuemax="100"><span></span></div>
<div class="final-logo" aria-hidden="true"><img src="/logos/kemensos.png" alt="Logo Kementerian Sosial Republik Indonesia" width="180" height="147"></div>
<a class="sr-only" href="https://docs.google.com/forms/d/e/1FAIpQLSfugEp7XQ_YmR9PQNEqLjtm-wilOqlUvF7hW_ewSOt_2Y_guw/viewform">Lanjut ke kuesioner</a>
<script>
(() => {
  const destination = "https://docs.google.com/forms/d/e/1FAIpQLSfugEp7XQ_YmR9PQNEqLjtm-wilOqlUvF7hW_ewSOt_2Y_guw/viewform";
  const start = performance.now();
  const finish = () => {
    document.body.classList.add("final-screen");
    window.setTimeout(() => window.location.replace(destination), Math.max(0, 3000 - (performance.now() - start)));
  };
  window.setTimeout(finish, 2800);
})();
</script>
</body>
</html>
