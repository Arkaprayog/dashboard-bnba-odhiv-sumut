<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>DATA BASE ODHIV SUMUT</title>
<style>
:root{--navy:#063d82;--blue:#0758b7;--sky:#159fe2;--cyan:#27c3df;--green:#1fbd83;--ink:#fff;--muted:#d8e8ff}
*{box-sizing:border-box}html{min-height:100%;background:#063a76}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 80% 18%,rgba(31,171,244,.92) 0,rgba(13,102,197,.62) 24%,transparent 50%),linear-gradient(145deg,#06447f 0%,#0759b5 44%,#003677 100%);position:relative;overflow:hidden}body:before{content:"";position:fixed;inset:10px;border:1.5px solid rgba(31,189,131,.8);border-radius:27px;pointer-events:none;z-index:2}body:after{content:"";position:fixed;width:125vw;height:42vh;left:-12vw;bottom:-24vh;transform:rotate(-9deg);background:linear-gradient(180deg,transparent 0 15%,rgba(39,195,223,.9) 15% 26%,rgba(4,119,210,.95) 26% 45%,rgba(0,52,126,.85) 45% 62%,rgba(20,195,221,.85) 62% 77%,rgba(0,76,131,.9) 77%);clip-path:polygon(0 30%,100% 0,100% 100%,0 100%);opacity:.9;pointer-events:none} .corner{position:fixed;width:220px;height:120px;border-top:5px solid var(--green);border-radius:70% 0 0 0;opacity:.9;pointer-events:none}.corner.top{top:0;left:0;transform:rotate(-8deg)}.corner.bottom{right:-35px;bottom:5px;transform:rotate(170deg)}main{position:relative;z-index:3;width:min(100%,520px);padding:34px clamp(18px,5vw,34px) 30px;text-align:center;background:linear-gradient(155deg,rgba(4,51,119,.32),rgba(0,39,102,.12));border:1px solid rgba(255,255,255,.14);border-radius:25px;box-shadow:0 22px 65px rgba(0,23,66,.24);backdrop-filter:blur(3px)}.logo{width:106px;height:106px;object-fit:contain;display:block;margin:0 auto 9px}.ministry{font-size:clamp(.8rem,3.3vw,1rem);font-weight:800;letter-spacing:.035em;line-height:1.45}.ministry small{display:block;font-size:.84em;font-weight:600}.brand{display:flex;align-items:center;justify-content:center;gap:14px;margin:30px 0 29px;text-align:left}.ribbon{width:34px;height:48px;object-fit:contain;flex:0 0 auto}.separator{width:1px;height:48px;background:rgba(255,255,255,.8);flex:0 0 auto}.brand h1{font-size:clamp(1.12rem,4.7vw,1.55rem);line-height:1.22;letter-spacing:.015em;margin:0;font-weight:850}.form{display:grid;gap:15px;text-align:left}.field{position:relative}.field input{width:100%;height:62px;border:1px solid rgba(255,255,255,.82);border-radius:13px;background:rgba(255,255,255,.97);padding:0 55px 0 58px;color:#123b67;font:inherit;font-size:1rem;outline:none;box-shadow:0 5px 18px rgba(0,27,81,.12)}.field input::placeholder{color:#8999ad}.field input:focus{border-color:#70e5c0;box-shadow:0 0 0 3px rgba(31,189,131,.2)}.lock{position:absolute;left:19px;top:50%;transform:translateY(-50%);color:#07528f;font-size:1.25rem;pointer-events:none}.toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#6d829a;padding:10px;font-size:1.1rem;cursor:pointer}.submit{height:62px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:linear-gradient(180deg,#0864ca,#03459e);color:white;font:inherit;font-weight:800;font-size:1.13rem;box-shadow:0 8px 18px rgba(0,25,83,.28);cursor:pointer}.submit:active{transform:translateY(1px)}.message{min-height:1.4em;margin:0;text-align:center;font-size:.88rem;color:#fff0c2;overflow-wrap:anywhere}.foot{margin:28px 0 0;font-size:.8rem;line-height:1.7;color:#e1edff}.shield{font-size:1.05rem;margin-right:7px}.setup{margin-top:15px;font-size:.78rem;line-height:1.5;color:#c9e4ff}@media(max-height:700px){main{padding-top:22px;padding-bottom:20px}.logo{width:78px;height:78px}.brand{margin:20px 0}.foot{margin-top:18px}}@media(min-width:700px){main{width:min(100%,560px);padding:38px 42px 34px}}
</style>
</head>
<body>
<div class="corner top" aria-hidden="true"></div><div class="corner bottom" aria-hidden="true"></div>
<main>
  <img class="logo" src="/kemensos-logo.png" alt="Logo Kementerian Sosial Republik Indonesia" onerror="this.style.display='none'">
  <div class="ministry">KEMENTERIAN SOSIAL<small>REPUBLIK INDONESIA</small></div>
  <div class="brand">
    <img class="ribbon" src="/pita-merah.png" alt="Pita merah solidaritas" onerror="this.style.display='none'">
    <span class="separator" aria-hidden="true"></span>
    <h1>DATA BASE ODHIV SUMUT</h1>
  </div>
  <form class="form" id="gateForm">
    <div class="field">
      <span class="lock" aria-hidden="true">▣</span>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password">
      <button class="toggle" id="togglePassword" type="button" aria-label="Tampilkan password">◎</button>
    </div>
    <button class="submit" type="submit">Masuk <span aria-hidden="true">→</span></button>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </form>
  <p class="foot"><span class="shield" aria-hidden="true">♢</span>Data aman · Sistem terintegrasi<br>Kementerian Sosial RI</p>
  <p class="setup">Halaman akses awal · Data responden tetap dilindungi</p>
</main>
<script>
const password=document.getElementById('password');
const toggle=document.getElementById('togglePassword');
const form=document.getElementById('gateForm');
const message=document.getElementById('message');
toggle.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.setAttribute('aria-label',show?'Sembunyikan password':'Tampilkan password');});
form.addEventListener('submit',async e=>{
 e.preventDefault();
 message.textContent='Autentikasi akses password saja belum diaktifkan. Password tidak dikirim atau disimpan oleh halaman ini.';
});
</script>
</body>
</html>
